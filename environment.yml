name: latte-workflow
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  - numpy>=1.24
  - pandas>=2.0,<3      # developed and tested with pandas 2.x
  - scipy>=1.10
  - matplotlib-base>=3.7
  - h5py>=3.8
  - pytables>=3.8        # required by pandas.read_hdf / DataFrame.to_hdf
  - hydra-core>=1.3      # also installs omegaconf and PyYAML
  - obspy>=1.4.1         # QuakeML parsing and geodetic distances
  - joblib>=1.3
  - tqdm>=4.65
  - numba>=0.58          # ray path simplification
