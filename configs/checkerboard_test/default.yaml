# Checkerboard Test Configuration for LATTE Tomographic Inversion
# This module creates synthetic checkerboard tests to assess resolution

defaults:
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_checkerboard_test_${hydra:job.config_name}

# General settings
general:
  # Output directory for all checkerboard test results
  output_dir: "/path/to/output/checkerboard_test"

  # Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  log_level: "INFO"

  # Random seed for reproducibility (set to null for random)
  random_seed: 42

# Input files
input:
  # Input velocity model CSV from preprocess module
  # Should contain: x, y, z, vp, vs (legacy X_grid_km/Y_grid_km/Z_grid_km are still read)
  velocity_model_csv: "/path/to/preprocess/output/velocity_model_init.csv"

  # Optional HDF5 input (if specified, takes precedence over CSV)
  velocity_model_hdf5: null  # e.g., "/path/to/preprocess/output/velocity_model_init.h5"

  # Directory containing original geometry files (to be reused)
  geometry_dir: "/path/to/preprocess/output/geometry"

  # Directory containing synthetic traveltime binary files from LATTE
  # Files should be named: shot_{shot_id}_traveltime_{phase}.bin
  synthetic_traveltime_dir: "/path/to/latte/output/synthetic_traveltimes"

  # Ground truth traveltime CSV (for matching metadata)
  ground_truth_csv: "/path/to/preprocess/output/geometry_csv/geometry_ground_truth_traveltimes.csv"

  # Directory containing inverted velocity binary files from LATTE
  # Files should be: updated_vp.bin, updated_vs.bin
  inverted_model_dir: "/path/to/latte/output/model"

  # Optional LATTE exchange_geometry.txt ("virtual_id x y z" per line, metres), used as the virtual-source table
  # when traveltime_noise.source_receiver_exchange = true; geometry_dir is then used to cross-check it.
  exchange_geometry_file: null  # e.g., "/path/to/latte/output/exchange_geometry.txt" (coordinates in metres)

# Checkerboard pattern configuration
checkerboard:
  enabled: true
  pattern_type: "sinusoidal"  # "sinusoidal" or "block"
  pattern_dimension: "3d"     # "3d" | "2d" (no depth variation) | "planar" (explicit depth planes)
  origin_polarity: "positive" # "positive" (default) or "negative" (inverts the pattern); ignored for "planar"

  # Depth planes for pattern_dimension: "planar" — depths in km, one layer each (snapped to nearest grid point).
  # An error is raised if both lists are empty when pattern_dimension is "planar".
  depth_planes_positive_polarity: []  # e.g. [5.0, 20.0, 35.0]
  depth_planes_negative_polarity: []  # e.g. [10.0, 25.0]

  amplitude: 0.05  # fractional perturbation (e.g. 0.05 = ±5%)

  # Cell sizes in each direction (km). wavelength_z_km is ignored for "2d" and "planar".
  wavelength_x_km: 10.0
  wavelength_y_km: 10.0
  wavelength_z_km: 5.0

  # Phase shifts in radians. phase_shift_z is ignored for "2d" and "planar".
  phase_shift_x: 0.0
  phase_shift_y: 0.0
  phase_shift_z: 0.0

  # Apply to which velocity fields
  apply_to_vp: true
  apply_to_vs: true

  # Velocity bounds (m/s) - perturbed values clipped to these ranges
  vp_min: 500.0
  vp_max: 10000.0
  vs_min: 500.0
  vs_max: 6000.0

  # Output format control
  # Options: "csv", "hdf5", "both"
  # Note: Binary files (.bin) for LATTE are always generated
  output_format: "csv"  # Default: CSV for backward compatibility

  output_csv: "${general.output_dir}/checkerboard_model/velocity_model_checkerboard.csv"
  output_hdf5: "${general.output_dir}/checkerboard_model/velocity_model_checkerboard.h5"

  # HDF5-specific options (used when output_format is "hdf5" or "both")
  hdf5_options:
    # Compression type: "gzip", "lzf", or null (no compression)
    compression: "gzip"

    # Compression level (0-9 for gzip, where 9 is maximum compression)
    compression_level: 4

    # Parallel processing for coarse grid subsampling
    parallel_processing: true
    n_jobs: -1  # -1 = use all CPU cores, 1 = sequential

    # Show progress bars during HDF5 operations
    show_progress: true

    # Create coarse-resolution dataset within HDF5 file
    # Coarse dataset enables faster visualization/analysis
    create_coarse_dataset: false

    # Coarse grid spacing (must be integral multiples of fine grid)
    coarse_grid:
      dx: 2.0  # km (e.g., 2x coarser than fine grid)
      dy: 2.0  # km
      dz: 2.0  # km

# Travel time noise configuration
traveltime_noise:
  enabled: true

  # Set true when LATTE forward modeling used source-receiver exchange (stations as virtual sources).
  source_receiver_exchange: false

  # Only needed if LATTE dropped shots/receivers (sid_select, sid_exclude, no valid receivers, ...).
  # Without them, a shot/receiver count mismatch between the geometry, ground truth and binaries raises an error.
  filtered_shot_ids: []      # e.g., [60]  (legacy key: removed_shots)
  filtered_receiver_ids: []  # station names, e.g., ["TX.ABC"]

  # Tolerance (metres) for matching geometry-file receiver coords to ground-truth stations.
  # Geometry files, exchange_geometry.txt and the travel-time CSV coordinates are all in metres.
  coordinate_tolerance: 0.01  # m

  noise_type: "gaussian"  # "gaussian" or "uniform"

  gaussian:
    mean: 0.0        # seconds
    std: 0.01        # seconds

  uniform:
    low: -0.02       # seconds
    high: 0.02       # seconds

  # Phase-specific overrides (take precedence over gaussian/uniform defaults above)
  p_wave:
    mean: 0.0
    std: 0.01

  s_wave:
    mean: 0.0
    std: 0.02

  output_precision: "single"  # "single" (float32) or "double" (float64)

  # SNR-based per-pick noise derived from event magnitude and hypocentral distance.
  magnitude_distance_noise:
    enabled: false            # Set to true to activate
    S0: 0.2                   # Reference SNR amplitude
    gamma: 1.0                # Geometric spreading exponent
    kappa: 0.003              # Attenuation coefficient (1/km)
    snr_max: 50.0             # SNR cap (prevents unrealistically small sigma_t)
    p_wave_frequency: 10.0   # Hz — used in sigma_t = 1/(2*pi*f*SNR) for P picks
    s_wave_frequency: 5.0    # Hz — used for S picks

# Model conversion configuration
model_conversion:
  # Enable conversion of inverted model to CSV
  enabled: true

  # Follows the postprocess velocity_processing section: the inverted binaries are converted
  # by the same code, with the same keys.
  phase_type: "both"                     # both | p | s

  # Directory where the converted inverted model (CSV/HDF5) is written (Step 3).
  # Change this to save the inverted model anywhere you like; the filenames below
  # are placed inside it.
  output_dir: "${general.output_dir}/inverted_model"

  # Inverted binaries written by LATTE
  vp_binary: "${input.inverted_model_dir}/updated_vp.bin"
  vs_binary: "${input.inverted_model_dir}/updated_vs.bin"

  # The grid of the LATTE binaries (nx, ny, nz, dx, dy, dz, origin_x/y/z) is read from the
  # metadata of the input velocity model written by preprocess, and checked against its
  # x/y/z columns. Define it here only if that model has no grid metadata and it cannot be
  # inferred from its columns (legacy files). The grid is tested against the number of values
  # in vp/vs_binary; if the metadata grid does not match them, model_grid is used when it does.
  model_grid:
    nx: 401
    ny: 361
    nz: 43
    dx: 0.5  # km
    dy: 0.5  # km
    dz: 0.5  # km
    origin_x: 0.0  # km
    origin_y: 0.0  # km
    origin_z: 0.0  # km

  # The input (reference) and output (binary) models may differ in dimensions:
  # sample_at_coarse samples the output at the input points; expand_to_fine writes the full output grid
  interpolation_mode: "sample_at_coarse"  # sample_at_coarse | expand_to_fine
  velocity_output_format: "csv"           # csv | hdf5 | both
  velocity_output_csv: "${model_conversion.output_dir}/velocity_model_final.csv"
  velocity_output_hdf5: "${model_conversion.output_dir}/velocity_model_final.h5"

  # HDF5 output options; used when velocity_output_format is 'hdf5' or 'both'
  hdf5_options:
    compression: "gzip"                   # gzip | lzf | null
    compression_level: 4                  # 0-9 for gzip; 4 is balanced
    use_coarse_dataset: false             # true = read the input model from its coarse dataset
    create_coarse_dataset: false          # true = write coarse dataset inside the HDF5 file
    write_coarse_csv: false               # true = write a separate coarse CSV file
    output_coarse_csv: "${model_conversion.output_dir}/velocity_model_final_coarse.csv"
    coarse_grid:
      dx: 2.0                             # km; must be an integer multiple of fine dx
      dy: 2.0                             # km; must be an integer multiple of fine dy
      dz: 2.0                             # km; must be an integer multiple of fine dz

  # Global parallel processing settings (as in postprocess)
  performance:
    n_jobs: -1                            # -1 = all cores, 1 = serial, N = N cores
    show_progress: true

# Visualization configuration
visualization:
  # Enable visualization
  enabled: true

  # Output directory for visualizations (optional)
  # If not specified, defaults to ${general.output_dir}/visualizations
  output_dir: null  # e.g., "/path/to/custom/visualization/directory"

  # Override to load the inverted model from a custom directory in Step 4 instead of
  # using the exact paths defined by model_conversion.velocity_output_csv / velocity_output_hdf5.
  # Useful when visualizing a model produced by a different run.
  # When null (default), Step 4 reads from model_conversion.velocity_output_csv / velocity_output_hdf5.
  inverted_model_dir: null  # e.g., "/path/to/other/run/inverted_model"

  # Slice planes to plot
  planes:
    - "xy"  # Depth slices
    - "xz"  # North-South vertical slices
    - "yz"  # East-West vertical slices

  # Which velocity field(s) to visualize.
  # Accepts a list for any combination, e.g. ["vp", "vs", "vpvs_ratio"].
  # Also accepts legacy strings: "vp", "vs", or "both" (equivalent to ["vp", "vs"]).
  velocity_field:
    - "vp"  # options: "vp", "vs", "vpvs_ratio"

  # Vp/Vs ratio settings (only used when "vpvs_ratio" is in velocity_field list)
  vpvs_ratio:
    colormap: "seismic"   # colormap for Vp/Vs ratio plots
    uniform_cbar: false     # true: same colorbar range across all slices; false: local per slice
    range: null             # e.g., [1.5, 2.5] — values outside this range are plotted in black; null = autoscale

  # Unit for slice positions: "indices" (grid indices) or "km" (physical units)
  slice_unit: "indices"  # Options: "indices", "km"

  # Unit for slice spacing: "indices" (grid spacing) or "km" (physical spacing)
  spacing_unit: "indices"  # Options: "indices", "km"

  # Tolerance for km-to-index conversion (km) - used when slice_unit or spacing_unit is "km"
  tolerance_km: 1e-6

  # Slice positions (null = use spacing). Interpreted per slice_unit.
  # Examples: indices=[0,10,20] or km=[0.0,5.0,10.0]
  xy_slices: null      # Z-axis (depth) slices
  xz_slices: null      # Y-axis (N-S vertical) slices
  yz_slices: null      # X-axis (E-W vertical) slices

  # Slice spacing (used when slices=null). Interpreted per spacing_unit.
  # Examples: indices=5 (every 5th point) or km=2.5 (every 2.5km on grid)
  slice_spacing:
    xy: 5   # Depth slice spacing
    xz: 20  # Y slice spacing
    yz: 20  # X slice spacing

  # Figure settings (shared across all visualizations)
  figure:
    dpi: 150
    figsize: [10, 8]
    format: "png"  # "png", "pdf", or "svg"
    recovery_contour_color: "green"  # Color for recovery contour lines
    recovery_contour_linestyle: "-"  # Line style: "-", "--", "-.", ":"
    recovery_contour_linewidth: 2  # Line width in points

  # Annotation settings (shared)
  show_colorbar: true
  show_grid: true
  show_title: true
  font_size:
    title: 14
    labels: 12
    colorbar: 10
    ticks: 10

  # Basin boundaries overlay on XY (depth) slices only
  basin_boundaries:
    enabled: false  # Set to true to enable basin boundaries on XY plots
    data_dir: "/path/to/preprocessed/coordinate_transform/basin_boundaries"
    basins:
      - file: "CentralBasin_Verticies_WGS84.csv"
        label: "Central Basin"
      - file: "DelawareBasin_Verticies_WGS84.csv"
        label: "Delaware Basin"
      - file: "MidlandBasin_Verticies_WGS84.csv"
        label: "Midland Basin"
    line_color: "darkgreen"
    line_width: 2
    line_style: "-"
    line_alpha: 0.8
    show_labels: true
    label_fontsize: 12
    label_fontweight: "bold"
    label_offset_x: 0.0  # km offset from centroid
    label_offset_y: 0.0  # km offset from centroid

  # Original velocity model visualization
  visualize_input:
    enabled: false
    colormap: "seismic"
    # No centering, no threshold - simple autoscale for vp/vs
    # For vpvs_ratio: uses visualization.vpvs_ratio settings (uniform_cbar, range, colormap)

  # Checkerboard perturbed model visualization
  visualize_checkerboard:
    enabled: false
    colormap: "seismic"
    # No centering, no threshold - simple autoscale for vp/vs
    # For vpvs_ratio: uses visualization.vpvs_ratio settings

  # Inverted model from LATTE visualization
  visualize_inverted:
    enabled: false
    colormap: "seismic"
    # No centering, no threshold - simple autoscale for vp/vs
    # For vpvs_ratio: uses visualization.vpvs_ratio settings

  # Difference plot (inverted - checkerboard) — vp/vs only; vpvs_ratio not plotted here
  visualize_difference:
    enabled: false
    colormap: "seismic"
    centered_at_zero: true    # Center colorbar at 0 (asymmetric range OK)
    uniform_cbar: false       # true: global min/max, false: local per slice
    # NO threshold support for difference plots

  # Checkerboard pattern (checkerboard - input) as % perturbation for vp/vs;
  # actual Vp/Vs ratio for vpvs_ratio (not % difference).
  # centered_at_zero and show_recovery_contours are ignored for vpvs_ratio.
  visualize_checkerboard_pattern:
    enabled: false
    colormap: "seismic"
    centered_at_zero: true    # Center colorbar at 0 (vp/vs only)
    uniform_cbar: false       # true: global, false: local (vp/vs only; vpvs_ratio uses vpvs_ratio.uniform_cbar)
    threshold: null           # e.g., 7.0 for +/-7% threshold (vp/vs only)
    mark_threshold_black: true # false: values beyond threshold saturate to the same color as the threshold itself
    show_recovery_contours: false  # Not applicable for checkerboard pattern
    recovery_threshold_pct: 3.0

  # Inverted pattern (inverted - input) as % perturbation for vp/vs;
  # actual Vp/Vs ratio for vpvs_ratio (not % difference).
  # centered_at_zero and show_recovery_contours are ignored for vpvs_ratio.
  visualize_inverted_pattern:
    enabled: false
    colormap: "seismic"
    centered_at_zero: true    # Center colorbar at 0 (vp/vs only)
    uniform_cbar: false       # true: global, false: local (vp/vs only; vpvs_ratio uses vpvs_ratio.uniform_cbar)
    threshold: null           # e.g., 7.0 for +/-7% threshold (vp/vs only)
    mark_threshold_black: true # false: values beyond threshold saturate to the same color as the threshold itself
    min_cbar_pct: null        # e.g., 7.0 → colorbar always shows at least ±7%; wider if data demands (vp/vs only; ignored when threshold set and mark_threshold_black=false)
    show_recovery_contours: false  # Show boundaries of fairly recovered regions (vp/vs only)
    recovery_threshold_pct: 3.0    # Fair recovery: same sign AND |inverted| >= threshold (%) (vp/vs only)

# Workflow control - which steps to execute
workflow:
  step1_create_checkerboard: false
  step2_add_noise: false
  step3_convert_inverted: false
  step4_visualize: false
