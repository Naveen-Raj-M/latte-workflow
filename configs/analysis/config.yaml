# Main configuration file for LATTE analysis
# This file contains the essential settings that users typically modify

# Inherit all defaults
defaults:
  - default

# Global analysis settings
analysis:
  log_level: "INFO"
  output_format: "png"

# Single function mode (optional)
# Uncomment to run only one analysis module instead of the full pipeline
# Options: travel_time_analysis, velocity_analysis, distance_analysis, short_distance_analysis
# single_function: travel_time_analysis

# Enable/disable analysis modules
travel_time_analysis:
  enabled: true
  input_csv: "data/processed/travel_time_residuals_corrected.csv"
  output_dir: "results/analysis/travel_time"

velocity_analysis:
  enabled: true
  model1_csv: "data/processed/velocity_cartesian_initial.csv"
  model2_csv: "data/processed/velocity_cartesian_updated.csv"
  output_dir: "results/analysis/velocity"
  comparison_mode: "initial_vs_final"

distance_analysis:
  enabled: true
  travel_time_csv: "data/processed/travel_time_residuals_corrected.csv"
  station_csv: "data/processed/stations_cartesian.csv"
  events_csv: "data/processed/events_cartesian_corrected.csv"
  output_dir: "results/analysis/distance"
  coordinate_type: "transformed"

short_distance_analysis:
  enabled: true
  travel_time_csv: "data/processed/travel_time_residuals_corrected.csv"
  station_csv: "data/processed/stations_cartesian.csv"
  events_csv: "data/processed/events_cartesian_corrected.csv"
  output_dir: "results/analysis/short_distance"
  distance_cutoff_km: 20.0
  coordinate_type: "transformed"

# Override specific settings if needed
# Example: Change plot style
# analysis:
#   plot_style:
#     font_size: 16
#     dpi: 150