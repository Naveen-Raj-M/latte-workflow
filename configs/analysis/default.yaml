# configs/analysis/default.yaml
# Configuration for post-inversion analysis of LATTE tomography results

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_analysis_${hydra:job.config_name}
  job_logging:
    root:
      handlers: []                        # disables Hydra's default console handler; setup_logging manages output

# Basin boundary overlays for XY plane plots across all analysis modules
# Provide the Cartesian-transformed boundary files produced by the preprocess module
basin_boundaries:
  data_dir: "/path/to/preprocessed/coordinate_transform/basin_boundaries"
  basins:
    - file: "CentralBasin_Verticies_WGS84.csv"
      label: "Central Basin"
    - file: "DelawareBasin_Verticies_WGS84.csv"
      label: "Delaware Basin"
    - file: "MidlandBasin_Verticies_WGS84.csv"
      label: "Midland Basin"
  line_color: "darkgreen"
  line_width: 2
  line_style: "-"                      # - | -- | : | -.
  line_alpha: 0.8                      # transparency (0 = transparent, 1 = opaque)
  show_labels: true
  label_fontsize: 12
  label_fontweight: "bold"             # normal | bold
  label_offset_x: 0.0                 # km offset from basin centroid
  label_offset_y: 0.0                 # km offset from basin centroid

# Global settings shared across all analysis modules
analysis:
  log_level: "INFO"                       # DEBUG | INFO | WARNING | ERROR
  output_format: "png"                    # png | pdf | svg
  dpi: 300
  phase_type: "both"                      # both | p | s

  # Matplotlib style applied globally before each module runs
  plot_style:
    font_family: "sans-serif"
    font_size: 14
    title_size: 16
    label_size: 14
    tick_size: 12
    legend_size: 12
    figure_title_size: 18
    line_width: 2
    marker_size: 4
    alpha: 0.7
    grid_alpha: 0.3
    # Scatter plots downsample to this limit to keep rendering fast
    max_plot_points: 100000

    # Hex color palette used across all plot modules
    colors:
      p_wave_dark: "#1f4e79"
      p_wave_light: "#5b9bd5"
      s_wave_dark: "#2e7d32"
      s_wave_light: "#66bb6a"
      event_color: "#ff6b35"
      station_color: "#4a4a4a"
      neutral_color: "#d32f2f"
      grid_color: "#cccccc"
      positive_residual: "#ff4444"
      negative_residual: "#4444ff"
      zero_line: "#000000"

# Velocity gradient and search direction analysis
gradient_analysis:
  enabled: false
  analysis_type: ["velocity", "source"]   # subset of: velocity, source

  # Input files — HDF5 takes precedence over CSV when both are set
  velocity_input_csv: /path/to/postprocessed/velocity/csv
  velocity_input_hdf5: null               # null = use CSV
  velocity_output_dir: "/path/to/velocity_gradient_analysis"
  source_input_csv: /path/to/postprocessed/source/csv
  source_input_hdf5: null                 # null = use CSV
  source_output_dir: "/path/to/source_gradient_analysis"

  histogram_bins: 50
  depth_bins: 10
  min_points_per_bin: 10

  generate_report: true
  create_histograms: true
  create_alignment_plots: true
  create_spatial_plots: true
  create_depth_profiles: true
  plot_basin_boundaries: false            # true = overlay basin boundaries on XY spatial plots

# Travel time residual analysis
travel_time_analysis:
  enabled: false
  comparison_mode: "ground_truth"         # ground_truth | method_comparison

  # ground_truth mode: single residual CSV compared against zero
  input_csv: null
  output_dir: null

  # method_comparison mode: two residual CSVs compared against each other
  method1_csv: null
  method2_csv: null
  method1_name: "Method 1"
  method2_name: "Method 2"

  enable_log_log_plots: true
  enable_ln_ratio_analysis: true
  enable_corrected_format: true           # true = parse picks in LATTE corrected-residual format

  outlier_threshold_sigma: 3.0            # residuals beyond N·σ are flagged as outliers
  min_residual_threshold: -50.0           # s; residuals below this are treated as unrealistic
  max_residual_threshold: 50.0            # s; residuals above this are treated as unrealistic

  histogram_bins: 50
  scatter_alpha: 0.6
  scatter_size: 15

  generate_summary_report: true
  include_mismatch_log: true              # true = log picks present in one file only
  include_unrealistic_log: true           # true = log picks flagged by residual thresholds

# Velocity model comparison analysis
velocity_analysis:
  enabled: false
  comparison_mode: "initial_vs_final"     # initial_vs_final | method_comparison | custom

  # Input files — HDF5 takes precedence over CSV when both are set
  model1_csv: "data/processed/velocity_cartesian.csv"
  model1_hdf5: null                       # null = use CSV
  model2_csv: "data/processed/velocity_cartesian_updated.csv"
  model2_hdf5: null                       # null = use CSV
  output_dir: "results/analysis/velocity_comparison"

  initial_velocity_model_csv: null
  initial_velocity_model_hdf5: null       # null = use CSV

  # true = read 'velocity_coarse' HDF5 dataset for faster analysis
  use_coarse_dataset: false

  model1_name: "Initial Model"
  model2_name: "Final Model"
  custom_title1: "Model A"                # used when comparison_mode is 'custom'
  custom_title2: "Model B"                # used when comparison_mode is 'custom'

  compute_log_ratios: true
  compute_geometric_mean_ratios: true

  # Plot type toggles
  enable_basic_comparison_plots: true
  enable_spatial_projections: true
  enable_profile_analysis: true
  enable_slice_analysis: true
  enable_plane_ratio_plots: true
  enable_domain_overview: true
  plot_basin_boundaries: false            # true = overlay basin boundaries on all XY plane plots

  interpolation_method: "cubic"           # linear | cubic | nearest
  grid_resolution: 100
  contour_levels: 20
  velocity_colormap: "viridis"
  difference_colormap: "RdBu_r"
  ratio_colormap: "RdBu_r"

  # Per-plane ratio slice configuration
  plane_ratio_plots:
    planes:
      - plane_type: "xy"                  # xy | xz | yz
        coordinates: []
        label: "Horizontal Plane (xy)"
      - plane_type: "xz"
        coordinates: []
        label: "Vertical Plane (xz)"
      - plane_type: "yz"
        coordinates: []
        label: "Vertical Plane (yz)"

# Residual vs epicentral/hypocentral distance analysis
distance_analysis:
  enabled: false
  comparison_mode: "ground_truth"         # ground_truth | method_comparison

  # ground_truth mode inputs
  travel_time_csv: null
  station_csv: null
  events_csv: null
  output_dir: null

  # method_comparison mode inputs
  method1_csv: null
  method2_csv: null
  method1_name: "Method 1"
  method2_name: "Method 2"

  coordinate_type: "transformed"          # transformed | original
  distance_types: ["hypocentral"]         # list; hypocentral | epicentral

  enable_ratio_analysis: true
  enable_binned_analysis: true
  enable_correlation_analysis: true
  enable_log_plots: true

  distance_bins: 20
  max_distance_plot: null                 # null = auto from data
  min_distance_plot: 0.0
  correlation_method: "pearson"           # pearson | spearman
  fit_polynomial_degree: 1

# Residual analysis restricted to short source–receiver distances
short_distance_analysis:
  enabled: false
  comparison_mode: "ground_truth"         # ground_truth | method_comparison

  # ground_truth mode inputs
  travel_time_csv: null
  station_csv: null
  events_csv: null
  output_dir: null

  # method_comparison mode inputs
  method1_csv: null
  method2_csv: null
  method1_name: "Method 1"
  method2_name: "Method 2"

  distance_cutoff_km: 20.0               # km; only source–receiver pairs within this range are analysed
  coordinate_type: "transformed"          # transformed | original
  distance_types: ["hypocentral"]         # list; hypocentral | epicentral
  phase_filter: null                      # null = both phases | P | S

  min_residual_threshold: -5.0            # s
  max_residual_threshold: 5.0             # s

  show_events: true
  show_stations: true
  show_travel_paths: true
  enable_detailed_stats: true
  enable_residual_histograms: true
  enable_zoom_clusters: true              # true = render per-cluster zoom panels defined below

  # Spatial clusters for zoomed map panels; only used when enable_zoom_clusters is true
  zoom_clusters:
    - name: "Cluster_A"
      x_min: 350.0
      x_max: 450.0
      y_min: 300.0
      y_max: 400.0
      description: "Dense cluster in central region"
    - name: "Cluster_B"
      x_min: 620.0
      x_max: 700.0
      y_min: 150.0
      y_max: 200.0
      description: "Northeastern region"
    - name: "Cluster_C"
      x_min: 0.0
      x_max: 320.0
      y_min: 0.0
      y_max: 220.0
      description: "Northwestern region"

# Source parameter correction analysis
source_analysis:
  enabled: false
  comparison_mode: "ground_truth"         # ground_truth | method_comparison

  # ground_truth mode input
  input_csv: null
  output_dir: "results/analysis/source_corrections"

  # method_comparison mode inputs
  method1_csv: null
  method2_csv: null
  method1_name: "Method 1"
  method2_name: "Method 2"

  use_log_scale: false
  enable_depth_analysis: true
  origin_time_metadata_dir: null          # null = skip origin-time metadata loading
  zero_initial_origin_time: true          # true = treat initial origin time as 0 s

  depth_bins: 10
  min_events_per_bin: 5
  histogram_bins: 50
  max_arrows_map: 5000                    # max correction vectors drawn on the map plot

  generate_summary_report: true
  save_corrected_data: true               # true = write source_corrections_with_deltas.csv
  plot_basin_boundaries: false            # true = overlay basin boundaries on XY geographic map

# Derivative weight sum (DWS) model coverage analysis
dws_analysis:
  enabled: false

  input_hdf5: "/path/to/dws_values.h5"
  output_dir: "${paths.output_base_dir}/dws_analysis"

  # Plot type toggles
  enable_log_scale: true                  # true = produce both linear and log-scale plots
  enable_coverage_maps: true              # true = produce binary covered/uncovered maps
  enable_histograms: true
  enable_vertical_slices: true

  use_m2_units: false                     # true = display in m² instead of km² (1 km² = 1 000 000 m²)

  # Cells with DWS > coverage_threshold are considered covered; applies to coverage maps
  coverage_threshold: 0.0

  # Depth levels for horizontal slice plots (km)
  horizontal_slice_depths: [5.0, 10.0, 15.0, 20.0, 30.0, 40.0, 50.0]

  # Vertical slice positions (km)
  vertical_slices:
    xz_positions:                         # constant Y values for XZ slices
      - 120.0
    yz_positions:                         # constant X values for YZ slices
      - 100.0

  # DWS-specific plot settings (font sizes and dpi inherited from analysis.plot_style)
  plot_config:
    figure_width: 12
    figure_height: 10
    colormap: "viridis"                   # linear-scale colormap: viridis | plasma | inferno | jet
    colormap_log: "viridis"               # log-scale colormap
    equal_aspect: false
    grid: true
    depth_tolerance: 0.01                 # km; tolerance for horizontal slice depth matching
    position_tolerance: 0.01             # km; tolerance for vertical slice position matching

  generate_report: true
  plot_basin_boundaries: false            # true = overlay basin boundaries on horizontal slice and coverage map plots

# Ray path projection visualization
raypath_analysis:
  enabled: false

  # Input ray path cache (HDF5) produced by the postprocess module
  input_cache: "${paths.input_dir}/ray_paths/ray_paths.h5"
  output_dir: "${paths.output_base_dir}/raypaths/"

  phase_type: "both"                      # both | p | s

  # Event filtering — priority order: event_id_list_file > max_rays > subsample_fraction
  event_id_list_file: null               # null = no filter; or path to a text file of event IDs (one per line)
  shot_map_file: null                    # required when event_id_list_file is set; or null to use paths.shot_map_file
  max_rays: null                         # null = load all rays
  subsample_fraction: 1.0               # fraction of loaded rays to actually plot (0.0–1.0)

  # Receiver-level filter from a CSV (e.g. anomalous-pick export)
  filter_csv: null                       # null = disabled
  filter_match_tolerance_km: 0.5        # km; receiver coordinate match tolerance

  generate_report: true
  plot_basin_boundaries: false            # true = overlay basin boundaries on XY projection plot

  # Ray path plot settings (font sizes and dpi inherited from analysis.plot_style)
  plot:
    planes: ["xy", "xz", "yz"]          # projection planes to generate

    figure_width: 12
    figure_height: 10

    # Ray path rendering
    ray_color: "blue"
    ray_alpha: 0.3                       # transparency (0 = transparent, 1 = opaque)
    ray_linewidth: 0.5

    # Source marker
    source_color: "red"
    source_marker: "*"                   # *, o, ^, v, s, D
    source_size: 100

    # Receiver marker
    receiver_color: "green"
    receiver_marker: "^"                 # *, o, ^, v, s, D
    receiver_size: 50

    grid: true
    equal_aspect: true

# Ray density computation and grid coverage visualization
ray_density_analysis:
  enabled: false

  # Input ray path cache (HDF5) produced by the postprocess module
  input_cache: "${paths.input_dir}/ray_paths/ray_paths.h5"
  output_dir: "${paths.output_base_dir}/ray_density/"

  # Model grid — must match the inversion grid exactly
  grid:
    nx: 401
    ny: 361
    nz: 43
    dx: 0.5                              # km
    dy: 0.5                              # km
    dz: 0.5                              # km
    x_min: 0.0                           # km
    y_min: 0.0                           # km
    z_min: 0.0                           # km

  phase_type: "both"                     # both | p | s

  # Computation settings
  threshold: 0                           # cells with ray count < threshold are masked in plots
  num_samples_per_ray: 1000             # sample points per ray used for grid intersection
  n_jobs: -1                            # -1 = all cores, 1 = serial, N = N cores
  batch_size: 1000                      # rays per parallel batch

  # Event filtering — priority order: event_id_list_file > max_rays > subsample_fraction
  event_id_list_file: null              # null = no filter; or path to a text file of event IDs (one per line)
  shot_map_file: null                   # required when event_id_list_file is set; or null to use paths.shot_map_file
  max_rays: null                        # null = load all rays
  subsample_fraction: 1.0              # fraction of loaded rays to use (0.0–1.0)

  # Plot type toggles
  planes: ["xy", "xz", "yz"]           # projection planes to generate
  enable_xy_threshold_count: true       # true = map showing count of depth layers >= threshold
  enable_depth_slices: true             # true = horizontal slice plots at specified depths

  # Depth levels for horizontal slice plots (km)
  depth_slices: [5.0, 10.0, 15.0, 20.0, 30.0, 40.0, 50.0]

  plot_basin_boundaries: false            # true = overlay basin boundaries on XY projection and depth slice plots

  # Plot settings (font sizes and dpi inherited from analysis.plot_style)
  figure_width: 12
  figure_height: 10
  colormap: "hot"                       # density colormap: hot | viridis | plasma | inferno | jet

# Inversion tradeoff curve (data misfit vs. model variance)
tradeoff_analysis:
  enabled: false

  # Write a detailed report regardless of mode (evaluation settings, paths, computed values)
  write_report: true

  # iteration: auto-discovers iteration_*/ dirs; parameter: uses manually specified entries
  x_axis_mode: "iteration"             # iteration | parameter

  # Parameter sweep settings — used only when x_axis_mode = "parameter"
  parameter_mode:
    parameter_name: "step_max"          # label used on plots and in the text report
    p_wave_entries: []                  # list of {parameter_value, directory_name, iteration}
    s_wave_entries: []                  # list of {parameter_value, directory_name, iteration}

  # Y-axis mode
  y_axis_mode: "data_misfit"            # data_misfit | rms | data_variance (mean squared residual, s²)

  # data_misfit mode: reads a 3-column whitespace-separated file
  # Columns: iteration | data_misfit | normalized_data_misfit
  data_misfit_file_path: null           # path to data_misfit.txt
  use_normalized_misfit: false          # true = use normalized column; false = absolute

  # rms mode: computes RMS from per-iteration traveltime residual CSVs
  inversion_base_path: null             # dir containing iteration_*/ subdirs with traveltime CSVs
  traveltime_csv_pattern: "travel_time_residuals*.csv"
  phase_mode: "both"                    # both | p | s | separate
  min_residual_threshold: -50.0         # s; lower bound for RMS computation
  max_residual_threshold: 50.0          # s; upper bound for RMS computation

  # rms comparison mode
  rms_comparison_mode: "ground_truth"   # ground_truth | method_comparison
  method1_csv: null                     # static path to Method 1 traveltime CSV
  method2_csv_pattern: "travel_time_residuals*.csv"  # glob pattern for Method 2 CSV per iteration

  # Velocity model paths
  initial_model_csv: null               # path to initial velocity model CSV
  initial_model_hdf5: null              # path to initial velocity model HDF5 (takes precedence over CSV)
  inversion_analysis_dir: null          # dir containing iteration_*/ subdirs with postprocessed velocity
  velocity_dataset: "velocity"          # HDF5 dataset name: velocity | velocity_coarse

  # Model variance (X-axis)
  # Variance = mean(|v_initial − v_inverted|) over selected grid points (km/s)
  # For data_misfit mode with P+S combined: X = max(vp_variance, vs_variance)
  # For rms mode with phase_mode "separate": separate Vp and Vs curves are plotted
  model_variance:
    region: "full"                      # full | z_bounded | depth_layer
    z_bounds: [null, null]              # [z_min_km, z_max_km]; used when region = z_bounded
    depth_layers: []                    # [d1, d2, ...] km; used when region = depth_layer
    depth_tolerance_km: 0.5            # km; Z-matching tolerance for depth_layer mode
    x_bounds: [null, null]             # [x_min, x_max] km; optional spatial clip before variance
    y_bounds: [null, null]             # [y_min, y_max] km; optional spatial clip before variance
    use_percentage_change: false       # true = mean(|Δv| / |v_initial|) × 100  (%)
    aggregation: "mean"                # mean | max | model_variance | rms_variation — aggregation over selected grid points

  output_dir: "${paths.output_base_dir}/tradeoff_analysis"

  # Plot settings
  plot:
    figure_width: 10
    figure_height: 8
    show_grid: true
    show_iteration_labels: true         # true = annotate each data point with its iteration number
    use_log_scale_x: false              # true = log scale on X-axis (model variance)
    use_log_scale_y: false              # true = log scale on Y-axis (data misfit / RMS)
    x_label: null                       # null = auto ("Model Variance (km/s)" or "Model Variance (%)")
    y_label: null                       # null = auto-derived from y_axis_mode and phase_mode
    marker_style: "o"                   # matplotlib marker: o | s | ^ | D | etc.
    color_by_iteration: false           # true = color each point by iteration number using colormap
    colormap: "viridis"                 # used when color_by_iteration is true
    highlight_optimal: false            # true = annotate the elbow/optimal point with a gold star
    vp_color: null                      # null = use analysis.plot_style.colors.p_wave_dark
    vs_color: null                      # null = use analysis.plot_style.colors.s_wave_dark

# File path patterns used across all analysis modules
paths:
  input_dir: "data/processed"
  output_base_dir: "results/analysis"
  travel_time_csv_pattern: "travel_time_residuals*.csv"
  velocity_csv_pattern: "velocity_cartesian*.csv"
  station_csv_name: "stations_cartesian.csv"
  events_csv_name: "events_cartesian*.csv"
  source_csv_pattern: "source_corrections*.csv"
  plots_subdir: "plots"
  stats_subdir: "statistics"
  reports_subdir: "reports"

# Parallel processing (currently used by dws_analysis only)
performance:
  parallel_processing: false
  n_jobs: 1                             # number of parallel jobs; 1 = serial

# Input data validation before each analysis module runs
quality_control:
  validate_input_data: true             # true = abort if any required input file is missing
  check_coordinate_consistency: true    # true = warn when coordinate columns differ between models
