# Default configuration for LATTE analysis module

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_analysis_${hydra:job.config_name}

analysis:
  log_level: "DEBUG"  # Options: DEBUG, INFO, WARNING, ERROR
  output_format: "png"  # Options: png, pdf, svg
  dpi: 300
  save_intermediate_results: true

  phase_type: "both"  # Options: both, p, s
  max_depth_km: null

  plot_style:
    font_family: "sans-serif"
    font_size: 14
    title_size: 16
    label_size: 14
    tick_size: 12
    legend_size: 12
    figure_title_size: 18
    line_width: 2
    marker_size: 4
    alpha: 0.7
    grid_alpha: 0.3
    max_plot_points: 100000

    colors:
      p_wave_dark: "#1f4e79"
      p_wave_light: "#5b9bd5"
      s_wave_dark: "#2e7d32"
      s_wave_light: "#66bb6a"
      event_color: "#ff6b35"
      station_color: "#4a4a4a"
      neutral_color: "#d32f2f"
      grid_color: "#cccccc"
      positive_residual: "#ff4444"
      negative_residual: "#4444ff"
      zero_line: "#000000"

gradient_analysis:
  enabled: false
  analysis_type: ["velocity", "source"]  # Options: velocity, source
  # Input files - support both CSV and HDF5 (HDF5 takes precedence if both specified)
  velocity_input_csv: /path/to/postprocessed/velocity/csv
  velocity_input_hdf5: null  # Alternative: /path/to/postprocessed/velocity.h5
  velocity_output_dir: "/path/to/velocity_gradient_analysis"
  source_input_csv: /path/to/postprocessed/source/csv
  source_input_hdf5: null  # Alternative: /path/to/postprocessed/source.h5
  source_output_dir: "/path/to/source_gradient_analysis"
  histogram_bins: 50
  depth_bins: 10
  min_points_per_bin: 10
  generate_report: true
  create_histograms: true
  create_alignment_plots: true
  create_spatial_plots: true
  create_depth_profiles: true

travel_time_analysis:
  enabled: true
  comparison_mode: "ground_truth"  # Options: ground_truth, method_comparison
  input_csv: null
  output_dir: null
  method1_csv: null
  method2_csv: null
  method1_name: "Method 1"
  method2_name: "Method 2"
  enable_log_log_plots: true
  enable_ln_ratio_analysis: true
  enable_corrected_format: true
  outlier_threshold_sigma: 3.0
  min_residual_threshold: -50.0
  max_residual_threshold: 50.0
  histogram_bins: 50
  scatter_alpha: 0.6
  scatter_size: 15
  generate_summary_report: true
  include_mismatch_log: true
  include_unrealistic_log: true

velocity_analysis:
  enabled: true
  # Input files - support both CSV and HDF5 (HDF5 takes precedence if both specified)
  model1_csv: "data/processed/velocity_cartesian.csv"
  model1_hdf5: null  # Alternative: "data/processed/velocity_cartesian.h5"
  model2_csv: "data/processed/velocity_cartesian_updated.csv"
  model2_hdf5: null  # Alternative: "data/processed/velocity_cartesian_updated.h5"
  output_dir: "results/analysis/velocity_comparison"
  initial_velocity_model_csv: null
  initial_velocity_model_hdf5: null  # Alternative HDF5 initial model
  # Use coarse dataset for faster analysis (HDF5 only)
  use_coarse_dataset: false  # Set to true to use coarse grid for faster analysis
  comparison_mode: "initial_vs_final"  # Options: initial_vs_final, method_comparison, custom
  model1_name: "Initial Model"
  model2_name: "Final Model"
  custom_title1: "Model A"
  custom_title2: "Model B"
  compute_log_ratios: true
  compute_geometric_mean_ratios: true
  enable_basic_comparison_plots: true
  enable_spatial_projections: true
  enable_profile_analysis: true
  enable_slice_analysis: true
  enable_plane_ratio_plots: true
  enable_domain_overview: true
  interpolation_method: "cubic"  # Options: linear, cubic, nearest
  grid_resolution: 100
  contour_levels: 20
  velocity_colormap: "viridis"
  difference_colormap: "RdBu_r"
  ratio_colormap: "RdBu_r"

  plane_ratio_plots:
    planes:
      - plane_type: "xy"  # Options: xy, xz, yz
        coordinates: []
        label: "Horizontal Plane (xy)"
      - plane_type: "xz"  # Options: xy, xz, yz
        coordinates: []
        label: "Vertical Plane (xz)"
      - plane_type: "yz"  # Options: xy, xz, yz
        coordinates: []
        label: "Vertical Plane (yz)"

distance_analysis:
  enabled: true
  comparison_mode: "ground_truth"  # Options: ground_truth, method_comparison
  travel_time_csv: null
  station_csv: null
  events_csv: null
  output_dir: null
  method1_csv: null
  method2_csv: null
  method1_name: "Method 1"
  method2_name: "Method 2"
  coordinate_type: "transformed"  # Options: transformed, original
  distance_types: ["hypocentral"]  # Options: hypocentral, epicentral
  enable_ratio_analysis: true
  enable_binned_analysis: true
  enable_correlation_analysis: true
  distance_bins: 20
  enable_log_plots: true
  max_distance_plot: null
  min_distance_plot: 0.0
  correlation_method: "pearson"  # Options: pearson, spearman
  fit_polynomial_degree: 1

short_distance_analysis:
  enabled: true
  comparison_mode: "ground_truth"  # Options: ground_truth, method_comparison
  travel_time_csv: null
  station_csv: null
  events_csv: null
  output_dir: null
  method1_csv: null
  method2_csv: null
  method1_name: "Method 1"
  method2_name: "Method 2"
  distance_cutoff_km: 20.0
  coordinate_type: "transformed"  # Options: transformed, original
  distance_types: ["hypocentral"]  # Options: hypocentral, epicentral
  phase_filter: null  # Options: null, P, S
  min_residual_threshold: -5.0
  max_residual_threshold: 5.0
  show_events: true
  show_stations: true
  show_travel_paths: true
  enable_detailed_stats: true
  enable_residual_histograms: true
  enable_zoom_clusters: true
  zoom_clusters:
    - name: "Cluster_A"
      x_min: 350.0
      x_max: 450.0
      y_min: 300.0
      y_max: 400.0
      description: "Dense cluster in central region"
    - name: "Cluster_B"
      x_min: 620.0
      x_max: 700.0
      y_min: 150.0
      y_max: 200.0
      description: "Northeastern region"
    - name: "Cluster_C"
      x_min: 0.0
      x_max: 320.0
      y_min: 0.0
      y_max: 220.0
      description: "Northwestern region"

source_analysis:
  enabled: false
  comparison_mode: "ground_truth"  # Options: ground_truth, method_comparison
  input_csv: null
  output_dir: "results/analysis/source_corrections"
  method1_csv: null
  method2_csv: null
  method1_name: "Method 1"
  method2_name: "Method 2"
  use_log_scale: false
  enable_depth_analysis: true
  origin_time_metadata_dir: null
  zero_initial_origin_time: true
  depth_bins: 10
  min_events_per_bin: 5
  histogram_bins: 50
  max_arrows_map: 5000
  generate_summary_report: true
  save_corrected_data: true

# DWS analysis configuration
dws_analysis:
  enabled: false

  # Input HDF5 file containing DWS values
  input_hdf5: "/path/to/dws_values.h5"

  # Output directory for analysis results
  output_dir: "${paths.output_base_dir}/dws_analysis"

  # Visualization options
  enable_log_scale: true  # Create both linear and log scale plots
  enable_coverage_maps: true  # Create binary coverage maps
  enable_histograms: true  # Create histograms of DWS values
  enable_vertical_slices: true  # Create vertical slice plots
  use_m2_units: false  # If true, plot DWS values in m² instead of km² (1 km² = 1,000,000 m²)

  # Coverage threshold for coverage maps (in km², not affected by use_m2_units)
  # Cells with DWS > threshold are considered "covered"
  coverage_threshold: 0.0

  # Horizontal slice depths (km) - specify depths where you want to visualize DWS
  horizontal_slice_depths: [5.0, 10.0, 15.0, 20.0, 30.0, 40.0, 50.0]  

  # Vertical slice positions (km)
  vertical_slices:
    # XZ slices (constant Y positions)
    xz_positions:
      - 120.0  # Y = 120 km
    # YZ slices (constant X positions)
    yz_positions:
      - 100.0  # X = 100 km

  # DWS-specific plot configuration (inherits from analysis.plot_style for fonts/dpi)
  plot_config:
    figure_width: 12
    figure_height: 10
    colormap: 'viridis'  # For linear scale: viridis, plasma, inferno, magma, jet
    colormap_log: 'viridis'  # For log scale
    equal_aspect: false
    grid: true
    depth_tolerance: 0.01  # Tolerance for depth matching (km)
    position_tolerance: 0.01  # Tolerance for position matching (km)

  # Report generation
  generate_report: true

# Ray path visualization analysis configuration
raypath_analysis:
  enabled: false

  # Input HDF5 cache file containing ray paths (from postprocess module)
  input_cache: "${paths.input_dir}/ray_paths/ray_paths.h5"

  # Output directory for analysis results
  output_dir: "${paths.output_base_dir}/raypaths/"

  # Phase type to visualize
  phase_type: "both"  # Options: both, p, s

  # Event filtering/subsampling (priority: event_id_list_file > max_rays > subsample_fraction)
  event_id_list_file: null  # Path to text file with event IDs (one per line), or null
  shot_map_file: null  # Path to shot map TSV (required if using event_id_list_file), or null to use paths.shot_map_file
  max_rays: null  # Maximum rays to load (null for all)
  subsample_fraction: 1.0  # Fraction of rays to plot (0.0-1.0)

  # Vectorization optimization
  num_samples_per_ray: 500  # Resample all rays to this many points for vectorized operations (faster plotting)
  use_vectorized_loading: true  # Use vectorized ray loading (recommended for large datasets)

  # 3D plot (disabled by default due to performance)
  enable_3d_plot: false

  # Report generation
  generate_report: true

  # Basin boundaries (optional, shown on XY plane plots only)
  # These should be the transformed (Cartesian) basin boundary files from preprocessing
  basin_boundaries:
    enabled: false  # Set to true to enable basin boundaries on XY plots
    data_dir: "/path/to/preprocessed/coordinate_transform/basin_boundaries"  # Directory with transformed basin CSVs
    # Basin files (same names as preprocessing output)
    basins:
      - file: "CentralBasin_Verticies_WGS84.csv"
        label: "Central Basin"
      - file: "DelawareBasin_Verticies_WGS84.csv"
        label: "Delaware Basin"
      - file: "MidlandBasin_Verticies_WGS84.csv"
        label: "Midland Basin"
    # Styling options
    line_color: "darkgreen"
    line_width: 2
    line_style: "-"
    line_alpha: 0.8
    show_labels: true
    label_fontsize: 12
    label_fontweight: "bold"
    label_offset_x: 0.0  # km offset from centroid
    label_offset_y: 0.0  # km offset from centroid

  # Plot configuration
  plot:
    planes: ["xy", "xz", "yz"]  # Projection planes to plot
    format: "png"  # Options: png, pdf, svg
    dpi: 300
    figure_width: 12
    figure_height: 10

    # Ray path styling
    ray_color: "blue"
    ray_alpha: 0.3  # Transparency (0-1)
    ray_linewidth: 0.5

    # Source styling
    source_color: "red"
    source_marker: "*"  # Options: *, o, ^, v, s, D
    source_size: 100

    # Receiver styling
    receiver_color: "green"
    receiver_marker: "^"  # Options: *, o, ^, v, s, D
    receiver_size: 50

    # Plot formatting
    grid: true
    equal_aspect: true
    label_fontsize: 12
    title_fontsize: 14
    legend_fontsize: 10

# Ray density analysis configuration
ray_density_analysis:
  enabled: false

  # Input HDF5 cache file containing ray paths (from postprocess module)
  input_cache: "${paths.input_dir}/ray_paths/ray_paths.h5"

  # Output directory for analysis results
  output_dir: "${paths.output_base_dir}/ray_density/"

  # Grid dimensions (should match the model grid)
  grid:
    nx: 401
    ny: 361
    nz: 43
    dx: 0.5  # km
    dy: 0.5  # km
    dz: 0.5  # km
    x_min: 0.0  # km
    y_min: 0.0  # km
    z_min: 0.0  # km

  # Phase type to analyze
  phase_type: "both"  # Options: both, p, s

  # Ray density computation settings
  threshold: 0  # Ray count threshold for visualization (cells below are masked)
  num_samples_per_ray: 1000  # Number of sample points per ray for grid intersection
  n_jobs: -1  # Number of parallel jobs (-1 = all cores, 1 = sequential)
  batch_size: 1000  # Number of rays per batch for parallel processing

  # Event filtering/subsampling (priority: event_id_list_file > max_rays > subsample_fraction)
  event_id_list_file: null  # Path to text file with event IDs (one per line), or null
  shot_map_file: null  # Path to shot map TSV (required if using event_id_list_file), or null to use paths.shot_map_file
  max_rays: null  # Maximum rays to load from cache (null for all)
  subsample_fraction: 1.0  # Fraction of rays to use (0.0-1.0)

  # Visualization options
  planes: ["xy", "xz", "yz"]  # Projection planes to plot
  enable_xy_threshold_count: true  # Create map showing depth layers >= threshold
  enable_depth_slices: true  # Create horizontal slices at specified depths

  # Depth slices to create (in km)
  depth_slices: [5.0, 10.0, 15.0, 20.0, 30.0, 40.0, 50.0]

  # Basin boundaries (optional, shown on XY plane plots only)
  # These should be the transformed (Cartesian) basin boundary files from preprocessing
  basin_boundaries:
    enabled: false  # Set to true to enable basin boundaries on XY plots
    data_dir: "/path/to/preprocessed/coordinate_transform/basin_boundaries"  # Directory with transformed basin CSVs
    # Basin files (same names as preprocessing output)
    basins:
      - file: "CentralBasin_Verticies_WGS84.csv"
        label: "Central Basin"
      - file: "DelawareBasin_Verticies_WGS84.csv"
        label: "Delaware Basin"
      - file: "MidlandBasin_Verticies_WGS84.csv"
        label: "Midland Basin"
    # Styling options
    line_color: "darkgreen"
    line_width: 2
    line_style: "-"
    line_alpha: 0.8
    show_labels: true
    label_fontsize: 12
    label_fontweight: "bold"
    label_offset_x: 0.0  # km offset from centroid
    label_offset_y: 0.0  # km offset from centroid

  # Plot configuration
  figure_width: 12
  figure_height: 10
  colormap: "hot"  # Colormap for density plots

tradeoff_analysis:
  enabled: false

  # --- Y-axis mode ---
  y_axis_mode: "data_misfit"          # Options: "data_misfit", "rms"

  # data_misfit mode: read from a data_misfit.txt file (3-column whitespace-separated)
  # Columns: iteration | data_misfit | normalized_data_misfit
  data_misfit_file_path: null         # e.g. /path/to/inversion_runs/.../data_misfit.txt
  use_normalized_misfit: false        # true = use normalized column; false = absolute

  # rms mode: compute RMS from per-iteration traveltime residual CSVs
  inversion_base_path: null           # Dir containing iteration_*/ subdirs with traveltime CSVs
  traveltime_csv_pattern: "travel_time_residuals*.csv"
  phase_mode: "both"                  # Options: "both", "p", "s", "separate"
  min_residual_threshold: -50.0       # Residual threshold (s) for RMS computation
  max_residual_threshold: 50.0

  # rms comparison mode: 'ground_truth' or 'method_comparison'
  rms_comparison_mode: "ground_truth"
  method1_csv: null                   # Static path to Method 1 traveltime CSV
  method2_csv_pattern: "travel_time_residuals*.csv"  # Pattern for Method 2 CSV per iteration

  # --- Model paths ---
  initial_model_csv: null             # Path to initial velocity model CSV
  initial_model_hdf5: null            # Path to initial velocity model HDF5 (takes precedence)
  inversion_analysis_dir: null        # Dir containing iteration_*/ subdirs with postprocessed velocity
  velocity_dataset: "velocity"        # HDF5 dataset name: "velocity" or "velocity_coarse"

  # --- Model variance (X-axis) ---
  # Model variance = mean(|v_initial - v_inverted|) at selected grid points (km/s)
  # For data_misfit mode (P+S combined): X = max(vp_variance, vs_variance)
  # For rms mode with phase_mode "separate": separate vp and vs curves plotted
  model_variance:
    region: "full"                    # Options: "full", "z_bounded", "depth_layer"
    z_bounds: [null, null]            # [z_min_km, z_max_km] — used when region = "z_bounded"
    depth_layers: []                  # [d1, d2, ...] km — used when region = "depth_layer"
    depth_tolerance_km: 0.5           # Z-matching tolerance for depth_layer mode
    x_bounds: [null, null]            # Optional: [x_min, x_max] km (applied before variance)
    y_bounds: [null, null]            # Optional: [y_min, y_max] km (applied before variance)
    use_percentage_change: false      # true = mean(|v_initial - v_inverted| / |v_initial|) * 100 (%)
    aggregation: "mean"               # Aggregation over selected grid points: "mean" or "max"

  # --- Output ---
  output_dir: "${paths.output_base_dir}/tradeoff_analysis"

  # --- Plot controls ---
  plot:
    figure_width: 10
    figure_height: 8
    show_grid: true
    show_iteration_labels: true       # Annotate each data point with its iteration number
    use_log_scale_x: false            # Log scale on X-axis (model variance)
    use_log_scale_y: false            # Log scale on Y-axis (data misfit / RMS)
    x_label: null                     # null = auto-derived ("Model Variance (km/s)" or "Model Variance (%)")
    y_label: null                     # null = auto-derived from y_axis_mode and phase_mode
    marker_style: "o"                 # Matplotlib marker style: "o", "s", "^", "D", etc.
    color_by_iteration: false         # Color each point by iteration number using colormap
    colormap: "viridis"               # Colormap when color_by_iteration is true
    highlight_optimal: false          # Annotate the elbow/optimal point with a gold star
    vp_color: null                    # null = use analysis.plot_style.colors.p_wave_dark
    vs_color: null                    # null = use analysis.plot_style.colors.s_wave_dark

paths:
  input_dir: "data/processed"
  output_base_dir: "results/analysis"
  travel_time_csv_pattern: "travel_time_residuals*.csv"
  velocity_csv_pattern: "velocity_cartesian*.csv"
  station_csv_name: "stations_cartesian.csv"
  events_csv_name: "events_cartesian*.csv"
  source_csv_pattern: "source_corrections*.csv"
  plots_subdir: "plots"
  stats_subdir: "statistics"
  reports_subdir: "reports"

performance:
  max_memory_gb: 8.0
  subsample_large_datasets: false
  subsample_threshold: 100000
  parallel_processing: false
  n_jobs: 1

logging:
  log_to_file: true
  log_file_prefix: "analysis"
  detailed_progress: true
  profile_memory: false
  profile_timing: false

quality_control:
  validate_input_data: true
  check_coordinate_consistency: true
  warn_missing_data: true
  error_on_empty_results: true
  max_velocity_km_s: 15.0
  min_velocity_km_s: 0.5
  max_travel_time_s: 1000.0
  min_travel_time_s: 0.0
  max_distance_km: 2000.0
