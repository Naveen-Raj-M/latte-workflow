# configs/analysis/example.yaml
# Minimal example overriding only necessary fields

defaults:
  - default
  - _self_

paths:
  input_dir: "/path/to/postprocessed/output"
  output_base_dir: "/path/to/analysis/output"

analysis:
  phase_type: "both"                      # both | p | s

basin_boundaries:
  data_dir: "/path/to/preprocessed/coordinate_transform/basin_boundaries"

travel_time_analysis:
  enabled: true
  input_csv: "/path/to/synthetic_traveltimes.csv"
  output_dir: "/path/to/analysis/output/travel_time"

velocity_analysis:
  enabled: true
  model1_csv: "/path/to/velocity_cartesian_initial.csv"
  model2_csv: "/path/to/velocity_cartesian_latte_output.csv"
  output_dir: "/path/to/analysis/output/velocity_comparison"

gradient_analysis:
  enabled: true
  velocity_input_csv: "/path/to/velocity_cartesian_latte_output.csv"
  velocity_output_dir: "/path/to/analysis/output/gradient_velocity"
  source_input_csv: "/path/to/source_relocation.csv"
  source_output_dir: "/path/to/analysis/output/gradient_source"

distance_analysis:
  enabled: true
  travel_time_csv: "/path/to/synthetic_traveltimes.csv"
  station_csv: "/path/to/preprocessed/coordinate_transform/stations_cartesian.csv"
  events_csv: "/path/to/preprocessed/coordinate_transform/events_cartesian.csv"
  output_dir: "/path/to/analysis/output/distance_analysis"

short_distance_analysis:
  enabled: true
  travel_time_csv: "/path/to/synthetic_traveltimes.csv"
  station_csv: "/path/to/preprocessed/coordinate_transform/stations_cartesian.csv"
  events_csv: "/path/to/preprocessed/coordinate_transform/events_cartesian.csv"
  output_dir: "/path/to/analysis/output/short_distance_analysis"
  distance_cutoff_km: 20.0

source_analysis:
  enabled: true
  input_csv: "/path/to/source_relocation.csv"
  output_dir: "/path/to/analysis/output/source_analysis"
