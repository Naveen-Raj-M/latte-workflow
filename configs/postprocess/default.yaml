# configs/postprocess/default.yaml

general:
  strict_mode: true
  log_level: INFO  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  phase_type: "both"  # Options: both, p, s
  precision:
    default: "single"  # Options: single, double
    st0: "single"  # Options: single, double
  max_depth_km: null

# Global performance settings for parallel processing
performance:
  parallel_processing: true  # Enable parallel processing across modules
  n_jobs: -1  # Number of parallel workers (-1 = use all available cores, 1 = sequential)
  backend: "multiprocessing"  # Options: loky, multiprocessing, threading
  batch_size: "auto"  # Batch size for chunking tasks. Options: "auto", integer, or null
  pre_dispatch: "2*n_jobs"  # Number of tasks to pre-dispatch
  show_progress: true  # Show progress bars during processing

  # I/O optimization settings for gradient loading
  # These settings can significantly speed up gradient file loading on parallel filesystems
  io:
    max_threads: 8           # Max threads for parallel file I/O (48 is good for Lustre/GPFS)
    use_async: true           # Use async I/O (concurrent.futures) - faster for pure I/O
    cache_metadata: true      # Cache grid metadata (all shots typically share same grid)

# Global ray tracing settings (used by ray_path_visualization and dws_computation)
tracing:
  max_steps: 10000  # Maximum integration steps per ray
  step_size: 0.1  # Integration step size in km (smaller = more accurate but slower)
  tolerance: 0.5  # Distance tolerance to source in km (stop when within this distance)
  interpolation_method: "trilinear"  # Options: nearest, trilinear
  
data:
  base_dir: "/path/to/latte/output"
  analysis_output_dir: "/path/to/analysis/output"

velocity_processing:
  enabled: false
  # Input velocity file (auto-detects format from extension)
  original_velocity_csv: "/full/path/to/velocity_cartesian_final.csv"
  # original_velocity_hdf5: "/full/path/to/velocity_cartesian_final.h5"  # Alternative input
  vp_binary: "${data.base_dir}/model/updated_vp.bin"
  vs_binary: "${data.base_dir}/model/updated_vs.bin"
  fine_grid:
    nx: 401
    ny: 361
    nz: 43
    dx: 0.5
    dy: 0.5
    dz: 0.5
    origin_x: 0.0
    origin_y: 0.0
    origin_z: 0.0
  interpolation_mode: "sample_at_coarse"  # Options: sample_at_coarse, expand_to_fine
  # Output format: csv, hdf5, or both
  velocity_output_format: "csv"  # Default to csv for backward compatibility
  velocity_output_csv: "${data.analysis_output_dir}/velocity_cartesian_latte_output.csv"
  velocity_output_hdf5: "${data.analysis_output_dir}/velocity_cartesian_latte_output.h5"
  # HDF5-specific options (uses global performance settings)
  hdf5_options:
    compression: "gzip"
    compression_level: 4
    use_coarse_dataset: false  # If true, read from coarse dataset for faster processing
    # Coarse grid subsampling for output
    create_coarse_dataset: false  # Create coarse dataset INSIDE HDF5 file
    write_coarse_csv: false  # Write SEPARATE CSV file with coarse data
    output_coarse_csv: "${data.analysis_output_dir}/velocity_cartesian_latte_output_coarse.csv"
    coarse_grid:
      dx: 2.0
      dy: 2.0
      dz: 2.0
  use_chapman_inverse: false
  earth_radius_km: 6371.0
  parameters_to_process: ["vp", "vs"]  # Options: vp, vs
  grad_vp_binary: "${data.base_dir}/model/grad_vp.bin"
  grad_vs_binary: "${data.base_dir}/model/grad_vs.bin"
  srch_vp_binary: "${data.base_dir}/model/srch_vp.bin"
  srch_vs_binary: "${data.base_dir}/model/srch_vs.bin"

travel_time_processing:
  enabled: false
  ground_truth_csv: "/full/path/to/ground_truth_travel_times_corrected.csv"
  synthetic_tt_dir: "${data.base_dir}/synthetic_traveltimes"
  shot_map_file: "/full/path/to/shot_to_source_id_map.txt"
  source_receiver_exchange: false
  exchange_mapping_file: ${data.base_dir}/exchange_mapping.txt
  exchange_geometry_file: ${data.base_dir}/exchange_geometry.txt
  virtual_shot_mapping_file: ${data.base_dir}/shot_mapping.txt
  source_correction: false
  source_correction_file: ${data.base_dir}/model/updated_st0.bin
  removed_shots: []
  synthetic_tt_output_csv: "${data.analysis_output_dir}/synthetic_travel_times_latte_output.csv"

source_processing:
  enabled: false
  sx_file: "${data.base_dir}/model/updated_sx.bin"
  sy_file: "${data.base_dir}/model/updated_sy.bin"
  sz_file: "${data.base_dir}/model/updated_sz.bin"
  st0_file: "${data.base_dir}/model/updated_st0.bin"
  grid_dimensions: [4495]
  output_csv: "${data.analysis_output_dir}/source_parameters_latte_output.csv"
  parameters_to_process: ["sx", "sy", "sz", "st0"]  # Options: sx, sy, sz, st0
  grad_sx_file: "${data.base_dir}/model/grad_sx.bin"
  grad_sy_file: "${data.base_dir}/model/grad_sy.bin"
  grad_sz_file: "${data.base_dir}/model/grad_sz.bin"
  grad_st0_file: "${data.base_dir}/model/grad_st0.bin"
  srch_sx_file: "${data.base_dir}/model/srch_sx.bin"
  srch_sy_file: "${data.base_dir}/model/srch_sy.bin"
  srch_sz_file: "${data.base_dir}/model/srch_sz.bin"
  srch_st0_file: "${data.base_dir}/model/srch_st0.bin"

# Ray path diagnosis configuration (generates ray path cache and DWS files)
ray_path_diagnosis:
  enabled: false

  # Common input files
  ground_truth_csv: "${travel_time_processing.synthetic_tt_output_csv}"
  gradient_dir: "${data.base_dir}/gradient"
  shot_map_file: "${travel_time_processing.shot_map_file}"

  # Output files (HDF5 format)
  ray_path_output_file: "${data.analysis_output_dir}/ray_paths/ray_paths.h5"
  dws_output_file: "${data.analysis_output_dir}/dws_values.h5"

  # Cache behavior settings
  force_recompute: false           # Force recompute even if cache exists (deletes existing cache)
  compression: "gzip"              # Compression: gzip, lzf, or none
  compression_level: 4             # Compression level (1-9 for gzip)

  # Common grid dimensions (must match the model grid used for eikonal solver)
  grid:
    nx: 401
    ny: 361
    nz: 43
    dx: 0.5  # km
    dy: 0.5  # km
    dz: 0.5  # km
    origin_x: 0.0  # km
    origin_y: 0.0  # km
    origin_z: 0.0  # km

  # Common processing parameters
  phase_type: "both"  # Options: both, p, s
  precision: "single"  # Options: single, double (must match gradient file precision)
  max_shots: 0  # Maximum number of shots to process (0 = all)
  parallel_mode: "by_pairs"  # Options: by_shots, by_pairs (affects ray path computation)

  # What to compute/output
  compute_dws: true  # Compute Derivative Weight Sum

  # DWS-specific parameters (only used if compute_dws=true)
  dws:
    # Weight column name in ground truth CSV
    # If column doesn't exist, uniform weights (1.0) will be used
    weight_column: 'weight'

strict_mode: true
