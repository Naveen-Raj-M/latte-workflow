# configs/postprocess/default.yaml
# Post-processing configuration for LATTE tomography outputs

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_postprocess_${hydra:job.config_name}

general:
  strict_mode: true                       # true = stop on first error; false = continue
  log_level: INFO                         # DEBUG | INFO | WARNING | ERROR | CRITICAL

data:
  base_dir: "/path/to/latte/output"
  analysis_output_dir: "/path/to/analysis/output"

# Global parallel processing settings
performance:
  parallel_processing: true              # true = enable parallel processing across modules
  n_jobs: -1                             # -1 = all cores, 1 = serial, N = N cores
  backend: "multiprocessing"             # loky | multiprocessing | threading
  batch_size: "auto"                     # auto | integer | null
  pre_dispatch: "2*n_jobs"
  show_progress: true

velocity_processing:
  enabled: false
  phase_type: "both"                     # both | p | s
  # Input velocity file; format auto-detected from extension (.csv, .h5, .hdf5)
  reference_velocity_file: "/full/path/to/velocity_cartesian_init.csv"
  vp_binary: "${data.base_dir}/model/updated_vp.bin"
  vs_binary: "${data.base_dir}/model/updated_vs.bin"

  # The grid of the LATTE binaries (nx, ny, nz, dx, dy, dz, origin_x/y/z) is read from the
  # metadata of reference_velocity_file (written by preprocess) and checked against its x/y/z
  # columns. Define fine_grid only if the reference file has no grid metadata and the grid
  # cannot be inferred from its columns (legacy files):
  # fine_grid:
  #   nx: 401
  #   ny: 361
  #   nz: 43
  #   dx: 0.5                            # km
  #   dy: 0.5                            # km
  #   dz: 0.5                            # km
  #   origin_x: 0.0                      # km
  #   origin_y: 0.0                      # km
  #   origin_z: 0.0                      # km

  # applicable when input and output velocity models are in LATTE are of different dimensions
  interpolation_mode: "sample_at_coarse" # sample_at_coarse | expand_to_fine
  velocity_output_format: "csv"          # csv | hdf5 | both
  velocity_output_csv: "${data.analysis_output_dir}/velocity_model_final.csv"
  velocity_output_hdf5: "${data.analysis_output_dir}/velocity_model_final.h5"

  # HDF5 output options; used when velocity_output_format is 'hdf5' or 'both'
  hdf5_options:
    compression: "gzip"                  # gzip | lzf | null
    compression_level: 4                 # 0–9 for gzip; 4 is balanced
    use_coarse_dataset: false            # true = read from coarse dataset for faster processing
    create_coarse_dataset: false         # true = write coarse dataset inside the HDF5 file
    write_coarse_csv: false              # true = write a separate coarse CSV file
    output_coarse_csv: "${data.analysis_output_dir}/velocity_model_final_coarse.csv"
    coarse_grid:
      dx: 2.0                            # km; must be an integer multiple of fine dx
      dy: 2.0                            # km; must be an integer multiple of fine dy
      dz: 2.0                            # km; must be an integer multiple of fine dz

  # Gradient and search direction outputs; requires process_gradient or process_search to be true
  process_gradient: false                # true = load and output gradient fields (grad_vp, grad_vs)
  process_search: false                  # true = load and output search direction fields (srch_vp, srch_vs)
  parameters_to_process: ["vp", "vs"]   # vp | vs
  grad_vp_binary: "${data.base_dir}/model/grad_vp.bin"
  grad_vs_binary: "${data.base_dir}/model/grad_vs.bin"
  srch_vp_binary: "${data.base_dir}/model/srch_vp.bin"
  srch_vs_binary: "${data.base_dir}/model/srch_vs.bin"

travel_time_processing:
  enabled: false
  phase_type: "both"                     # both | p | s
  ground_truth_csv: "/full/path/to/geometry_ground_truth_traveltimes.csv"
  synthetic_tt_dir: "${data.base_dir}/synthetic"
  shot_map_file: "/full/path/to/shot_to_source_id_map.txt"
  synthetic_tt_output_csv: "${data.analysis_output_dir}/synthetic_traveltimes.csv"

  # Source-receiver exchange (reciprocity-based inversion)
  source_receiver_exchange: false
  # The exchange is rebuilt from the geometry files exactly as LATTE does it.
  geometry_dir: null                     # directory with geometry.txt and shot_<n>_geometry.txt (recommended)
  geometry_file: "geometry.txt"
  # Optional LATTE output used as the virtual-source table; if geometry_dir is also set, mismatches warn
  # and the run proceeds with this file. Without it, any count mismatch raises an error.
  exchange_geometry_file: null           # e.g. ${data.base_dir}/exchange_geometry.txt
  # Only needed if LATTE dropped shots/receivers (sid_select, sid_exclude, no valid receivers, ...):
  filtered_shot_ids: []                  # shot ids (geometry file ids) removed by LATTE
  filtered_receiver_ids: []              # station names removed by LATTE
  coordinate_tolerance: 1.0             # m, matches geometry receivers to ground-truth stations

  source_correction: false
  source_correction_file: ${data.base_dir}/model/updated_st0.bin

source_processing:
  enabled: false
  parameters_to_process: ["sx", "sy", "sz", "st0"]  # sx | sy | sz | st0; controls which files are read and validated
  sx_file: "${data.base_dir}/model/updated_sx.bin"
  sy_file: "${data.base_dir}/model/updated_sy.bin"
  sz_file: "${data.base_dir}/model/updated_sz.bin"
  st0_file: "${data.base_dir}/model/updated_st0.bin"
  n_sources: 4495
  output_csv: "${data.analysis_output_dir}/source_relocation.csv"

  # Gradient and search direction outputs; requires process_gradient or process_search to be true
  process_gradient: false                # true = load and output gradient fields (grad_sx, …, grad_st0)
  process_search: false                  # true = load and output search direction fields (srch_sx, …, srch_st0)
  grad_sx_file: "${data.base_dir}/model/grad_sx.bin"
  grad_sy_file: "${data.base_dir}/model/grad_sy.bin"
  grad_sz_file: "${data.base_dir}/model/grad_sz.bin"
  grad_st0_file: "${data.base_dir}/model/grad_st0.bin"
  srch_sx_file: "${data.base_dir}/model/srch_sx.bin"
  srch_sy_file: "${data.base_dir}/model/srch_sy.bin"
  srch_sz_file: "${data.base_dir}/model/srch_sz.bin"
  srch_st0_file: "${data.base_dir}/model/srch_st0.bin"

# Reads pre-computed ray path binaries from LATTE forward solver; builds HDF5 cache and optionally computes DWS
ray_path_diagnosis:
  enabled: false
  # Path to directory containing shot_*_raypath_*.bin files
  raypath_binary_dir: null
  ground_truth_csv: "${travel_time_processing.synthetic_tt_output_csv}"
  shot_map_file: "${travel_time_processing.shot_map_file}"
  ray_path_output_file: "${data.analysis_output_dir}/ray_paths/ray_paths.h5"
  dws_output_file: "${data.analysis_output_dir}/dws_values.h5"

  grid:
    nx: 101
    ny: 101
    nz: 101
    dx: 1.0                              # km
    dy: 1.0                              # km
    dz: 1.0                              # km
    origin_x: 0.0                        # km
    origin_y: 0.0                        # km
    origin_z: 0.0                        # km

  phase_type: "both"                     # both | p | s
  compute_dws: false                      # true = compute and write Derivative Weight Sum

  # Event filtering; applied only when compute_dws is false (cache-only optimization)
  # null = use all events; or path to a text file with one event ID per line
  event_id_list_file: null
  # Fraction of events to sample when event_id_list_file is null; 1.0 = all events
  subsample_fraction: 1.0

  force_recompute: false                # true = recompute all shots even if cache exists
  fix_corrupted_shots: true             # true = detect and recompute only corrupted shots
  compression: "gzip"                   # gzip | lzf | null
  compression_level: 4                  # 0–9 for gzip; 4 is balanced

  # DWS options; used only when compute_dws is true
  dws:
    weight_column: "weight"             # column name in CSV; uses 1.0 if not found

# RDP algorithm to reduce ray path memory footprint for downstream analysis
ray_path_simplification:
  enabled: false
  input_cache_path: "${data.analysis_output_dir}/ray_paths/ray_paths.h5"
  output_cache_path: "${data.analysis_output_dir}/ray_paths/ray_paths_simplified.h5"
  epsilon: 0.05                         # km; 0.01 = gentle, 0.05 = moderate, 0.10 = aggressive
  phase_type: "both"                    # both | p | s
