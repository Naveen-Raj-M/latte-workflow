# configs/postprocess/example.yaml
# Minimal example overriding only necessary fields

defaults:
  - default
  - _self_

data:
  base_dir: "/path/to/latte/output"
  analysis_output_dir: "/path/to/analysis/output"

velocity_processing:
  enabled: true
  reference_velocity_file: "/path/to/velocity_cartesian_final.csv"
  # Grid of the LATTE binaries comes from the reference file's metadata; an optional model_grid
  # block (nx, ny, nz, dx, dy, dz, origin_x/y/z) is an additional check (see default.yaml).

travel_time_processing:
  enabled: true
  ground_truth_csv: "/path/to/geometry_ground_truth_traveltimes.csv"
  shot_map_file: "/path/to/shot_to_source_id_map.txt"

source_processing:
  enabled: true
  # Initial locations (shot_id, event_x/y/z, origin_time_s); shots minus filtered_shot_ids must match the binary size
  initial_geometry_csv: ${travel_time_processing.ground_truth_csv}
  filtered_shot_ids: ${travel_time_processing.filtered_shot_ids}   # shots LATTE removed during inversion

ray_path_processing:
  enabled: true
  raypath_binary_dir: "/path/to/raypath/binaries"
  # Grid comes from reference_velocity_file (default: velocity_processing.reference_velocity_file);
  # an optional grid block (nx, ny, nz, dx, dy, dz, origin_x/y/z) is only a check, or the grid if the reference is null.
