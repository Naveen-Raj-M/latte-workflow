# configs/preprocess/default.yaml
# Configuration for preprocessing QuakeML seismic data

defaults:
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_preprocess_${hydra:job.config_name}

preprocessing:
  output_dir: "/path/to/output/files"
  log_level: INFO                         # DEBUG | INFO | WARNING | ERROR | CRITICAL

data:
  use_hdf5: true                          # true = load from HDF5, false = load from QuakeML
  hdf5_file: "/path/to/seismic_data.h5"
  # Directory containing QuakeML files; used when use_hdf5 is false
  quakeml_dir: "/path/to/quakeml/files"
  station_file: "/path/to/station_list.txt"
  output_base_dir: "/path/to/output"
  max_files: null                         # null = all files; positive int limits (for testing)
  # null = auto-detect year subdirectories and files directly in quakeml_dir; or [2020, 2021, 2022]
  years: null
  use_preferred_origin: true
  use_preferred_magnitude: true
  save_all_picks: false                   # false = only picks from the selected origin

# Parallel processing
parallel:
  num_workers: null                       # null = all CPU cores
  chunk_size: 100                         # events per chunk (parse_picks_with_cartesian)
  grid_chunk_size: 50000                  # grid points per chunk (velocity model creation)
  vectorize_max_points: 100000000         # max points for full vectorization (~6 GB RAM at 100 M)

filters:
  manual_picks_only: false                # true = only picks with evaluation_mode='manual'
  magnitude_min: null                     # null = no filter
  magnitude_max: null                     # null = no filter
  lat_min: null                           # degrees, null = no filter
  lat_max: null                           # degrees, null = no filter
  lon_min: null                           # degrees, null = no filter
  lon_max: null                           # degrees, null = no filter
  depth_min: null                         # km, null = no filter
  depth_max: null                         # km, null = no filter
  # Distance filters apply only when station coordinates are available
  hypocentral_distance_min: null          # km, null = no filter
  hypocentral_distance_max: null          # km, null = no filter
  epicentral_distance_min: null           # km, null = no filter
  epicentral_distance_max: null           # km, null = no filter

origin_time:
  mode: "fixed"                           # fixed | unix_epoch
  fixed_value: 0.0                        # seconds; used when mode is 'fixed'

# Converts geodetic (lon/lat/depth) to Cartesian (x/y/z km) via flattening transformation
coordinate_transform:
  enabled: true
  origin_lon: -108.0                      # degrees
  origin_lat: 34.5                        # degrees
  origin_depth_km: 0.0                    # km, positive = below MSL
  grid_spacing_km: [1.0, 1.0, 1.0]       # [dx, dy, dz] in km
  # true = +y going south (lat decreases); false = +y going north (lat increases)
  invert_y_axis: true
  output_dir: "${data.output_base_dir}/coordinate_transform"

  # Output CSV file paths
  events_cartesian_csv: "${coordinate_transform.output_dir}/events_cartesian.csv"
  stations_cartesian_csv: "${coordinate_transform.output_dir}/stations_cartesian.csv"
  picks_cartesian_csv: "${coordinate_transform.output_dir}/picks_cartesian.csv"
  events_geodetic_csv: "${data.output_base_dir}/events_geodetic.csv"
  stations_geodetic_csv: "${data.output_base_dir}/stations_geodetic.csv"

  # Transforms basin boundary CSVs from geographic to Cartesian coordinates
  # Output saved to: ${coordinate_transform.output_dir}/basin_boundaries/
  basin_boundaries:
    enabled: false
    data_dir: "/path/to/basin_boundaries"
    basins:
      - file: "CentralBasin_Verticies_WGS84.csv"
        label: "Central Basin"
      - file: "DelawareBasin_Verticies_WGS84.csv"
        label: "Delaware Basin"
      - file: "MidlandBasin_Verticies_WGS84.csv"
        label: "Midland Basin"

# Geometry and travel time file generation
geometry_traveltime:
  enabled: true

  # Input files (outputs from coordinate_transform)
  events_csv: "${coordinate_transform.events_cartesian_csv}"
  stations_csv: "${coordinate_transform.stations_cartesian_csv}"

  # Output directories
  geometry_dir: "${data.output_base_dir}/geometry"
  traveltime_dir: "${data.output_base_dir}/ground_truth_traveltimes"
  source_dir: "${data.output_base_dir}/model"

  generate_travel_time_csv: true
  csv_output_dir: "${data.output_base_dir}/geometry_csv"
  include_magnitude_in_csv: false         # true = adds magnitude column to travel time CSV
  generate_source_binaries: true

  # apply_default_weights and apply_azimuthal_weighting are mutually exclusive
  apply_default_weights: false
  default_weight: 1.0
  apply_azimuthal_weighting: false
  azimuthal_bin_size_deg: 30              # degrees; 30° creates 12 azimuthal bins
  # Weight formula: inverse_sqrt = 1/sqrt(N), inverse = 1/N
  azimuthal_weight_formula: "inverse_sqrt"
  # Azimuthal weighting uses global scale (pick counts per station-bin across ALL events)
  phase_type: "both"                      # both | p | s
  p_velocity_range_m_s: [500, 10000]      # m/s; picks outside this range are discarded
  s_velocity_range_m_s: [500, 6000]       # m/s; picks outside this range are discarded

# Initial 3D velocity model created by extruding a 1D depth profile
initial_velocity_model:
  enabled: true
  initial_model_file: "/path/to/initial_model.csv"
  max_depth_km: 100.0                     # km; model entries below this depth are ignored

  # Origin and grid spacing inherited from coordinate_transform
  origin_lon: "${coordinate_transform.origin_lon}"
  origin_lat: "${coordinate_transform.origin_lat}"
  origin_depth_km: "${coordinate_transform.origin_depth_km}"
  grid_spacing_km: "${coordinate_transform.grid_spacing_km}"

  # true = bounds computed from transformed events/stations; false = use manual bounds below
  use_auto_bounds: true
  # Manual bounds in Cartesian km relative to origin; used only when use_auto_bounds is false
  x_min: null
  x_max: null
  y_min: null
  y_max: null
  z_min: null
  z_max: null

  output_format: "csv"                    # csv | hdf5 | both
  output_csv: "${data.output_base_dir}/velocity_model_cartesian.csv"
  output_hdf5: "${data.output_base_dir}/velocity_model_cartesian.h5"
  vp_binary: "${data.output_base_dir}/model/vp_init.bin"
  vs_binary: "${data.output_base_dir}/model/vs_init.bin"

  # HDF5 output options; used when output_format is 'hdf5' or 'both'
  hdf5_options:
    compression: "gzip"                   # gzip | lzf | null
    compression_level: 4                  # 0–9 for gzip; 4 is balanced
    parallel_processing: true
    n_jobs: -1                            # -1 = all cores, 1 = serial, N = N cores
    show_progress: true
    create_coarse_dataset: false          # true = write coarse dataset inside the HDF5 file
    write_coarse_csv: false               # true = write a separate coarse CSV file
    output_coarse_csv: "${data.output_base_dir}/velocity_model_cartesian_coarse.csv"
    coarse_grid:
      dx: 2.0                             # km; must be an integer multiple of fine dx
      dy: 2.0                             # km; must be an integer multiple of fine dy
      dz: 2.0                             # km; must be an integer multiple of fine dz

  interpolate: true
  neighbor_threshold: 5
  phase_type: "both"                      # both | p | s

visualization:
  enabled: true

  # Station and event map view and cross-section plots
  station_event_vis:
    enabled: true
    output_dir: "${data.output_base_dir}/visualizations"
    figure_dpi: 150
    figure_size: [12, 10]                 # [width, height] in inches
    source_marker: "*"
    source_size: 100
    source_color: "red"
    receiver_marker: "^"
    receiver_size: 30
    receiver_color: "blue"
    plot_pick_lines: true
    pick_alpha: 0.3                       # transparency of pick lines (0=transparent, 1=opaque)

    # Basin boundary overlays shown on map view only
    basin_boundaries:
      enabled: false
      show_labels: true                   # false = boundary lines only, no text labels
      data_dir: "/path/to/basin_boundaries"
      basins:
        - file: "CentralBasin_Verticies_WGS84.csv"
          label: "Central Basin"
        - file: "DelawareBasin_Verticies_WGS84.csv"
          label: "Delaware Basin"
        - file: "MidlandBasin_Verticies_WGS84.csv"
          label: "Midland Basin"
      line_color: "darkgreen"
      line_width: 2
      line_style: "-"                     # - | -- | : | -.
      line_alpha: 0.8                     # transparency (0=transparent, 1=opaque)
      label_fontsize: 12
      label_fontweight: "bold"            # normal | bold
      label_offset_x: 0.0                 # degrees offset from basin centroid
      label_offset_y: 0.0                 # degrees offset from basin centroid

    fontsize:
      title: 16
      axis_label: 16
      axis_ticks: 14
      legend: 12
      colorbar_label: 14
      colorbar_ticks: 14

  # Velocity model depth slice and 1D profile plots
  velocity_model_vis:
    enabled: false
    output_dir: "${data.output_base_dir}/visualizations"
    plot_depth_slices: true
    # km; one contourf plot (Vp + Vs) is produced per depth
    depth_slices: [5, 10, 20, 30, 40, 50]
    plot_profiles: true
    profile_type: "both"                  # lat | lon | both

  # Ray path density visualization (coverage analysis)
  ray_density:
    enabled: false
    output_dir: "${data.output_base_dir}/visualizations"
    threshold: 1                          # cells with ray count below this shown as white; 0 = show all
    generate_report: true                 # writes ray_path_density_report.txt with statistics
    # Master switch for the xy/xz/yz summed projection plots
    plot_overall_ray_density: true
    # Individual projection planes; used only when plot_overall_ray_density is true
    plot_xy: true                         # map view, summed over depth
    plot_xz: true                         # vertical cross-section, summed over Y
    plot_yz: true                         # vertical cross-section, summed over X
    plot_xy_threshold_count: false        # map view: count of depth layers >= threshold
    plot_depth_slices: false
    depth_slices: [5, 10, 20, 30]         # km
    density_colormap: "hot"               # hot | viridis | plasma | inferno | jet
    use_parallel: true                    # reserved for future use
    show_progress: true
    figure_size: null                     # null = inherit from station_event_vis; or [width, height]
    figure_dpi: null                      # null = inherit from station_event_vis
    fontsize: null                        # null = inherit from station_event_vis
