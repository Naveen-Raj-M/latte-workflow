# configs/preprocess/default.yaml
# Configuration for preprocessing QuakeML seismic data

defaults:
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_preprocess_${hydra:job.config_name}

preprocessing:
  output_dir: "/path/to/output/files"
  log_level: INFO                         # DEBUG | INFO | WARNING | ERROR | CRITICAL
  # false = skip coordinate transform, geometry/travel time, velocity model and final
  # visualization; use with raw_data_visualization / hdf5_conversion only
  run_pipeline: true

data:
  use_hdf5: true                          # true = load from HDF5, false = load from QuakeML
  hdf5_file: "/path/to/seismic_data.h5"
  # Directory containing QuakeML files; used when use_hdf5 is false
  quakeml_dir: "/path/to/quakeml/files"
  station_file: "/path/to/station_list.txt"
  output_base_dir: "/path/to/output"
  max_files: null                         # null = all files; positive int limits (for testing)
  # null = auto-detect year subdirectories and files directly in quakeml_dir; or eg: [2020, 2021, 2022]
  years: null                             # directory structure: path/to/quakeml_dir/<year>/<filename>.qml 
  catalog_label: "catalog_1"              # value written to the 'catalog' column
  use_preferred_origin: true
  origin_index: 0                         # origin used when use_preferred_origin is false
  use_preferred_magnitude: true
  magnitude_index: 0                      # magnitude used when use_preferred_magnitude is false
  save_all_picks: false                   # false = only picks from the selected origin (pipeline)

  # Optional additional QuakeML catalogs
  # Rules to merge the same station code in multiple catalogs:
  #   same location (<= identical_tolerance_m)  -> shared station, never renamed
  #   closer than match_tolerance_m             -> renamed only if suffix_near_duplicate_stations
  #   farther than match_tolerance_m            -> renamed if suffix_conflicting_stations
  # Only the station IDs of additional catalogs are ever renamed (by appending station_suffix).
  secondary_catalogs:
    enabled: false
    quakeml_dir: ["/path/to/secondary/quakeml/files"]
    station_file: ["/path/to/secondary/station_list.txt"]
    catalog_label: ["catalog_2"]
    station_suffix: ["_catalog_2"]
    # Shared by all additional catalogs
    years: null                           # null = auto-detect year subdirectories
    max_files: null
    identical_tolerance_m: 1.0
    match_tolerance_m: 200.0
    suffix_near_duplicate_stations: false
    suffix_conflicting_stations: true

# Parallel processing
parallel:
  num_workers: null                       # null = all CPU cores
  chunk_size: 100                         # events per chunk (parse_picks_with_coordinates)
  grid_chunk_size: 50000                  # grid points per chunk (velocity model creation)
  vectorize_max_points: 100000000         # max points for full vectorization (~6 GB RAM at 100 M)

filters:
  manual_picks_only: false                # true = only picks with evaluation_mode='manual'
  magnitude_min: null                     # null = no filter
  magnitude_max: null                     # null = no filter
  lat_min: null                           # degrees, null = no filter
  lat_max: null                           # degrees, null = no filter
  lon_min: null                           # degrees, null = no filter
  lon_max: null                           # degrees, null = no filter
  depth_min: null                         # km, null = no filter
  depth_max: null                         # km, null = no filter
  # Distance filters apply only when station coordinates are available
  hypocentral_distance_min: null          # km, null = no filter
  hypocentral_distance_max: null          # km, null = no filter
  epicentral_distance_min: null           # km, null = no filter
  epicentral_distance_max: null           # km, null = no filter

# Raw data visualization of the QuakeML catalog (parsed once and shared with hdf5_conversion
# and the pipeline). Always reads QuakeML (data.quakeml_dir), independent of data.use_hdf5.
raw_data_visualization:
  enabled: false
  output_dir: "${data.output_base_dir}/raw_data_visualization"

  # Filters of this module only. Every key defaults to the global filter of the same name,
  # e.g. magnitude_min: ${filters.magnitude_min}; override a key to decouple it.
  filters:
    manual_picks_only: ${filters.manual_picks_only}
    magnitude_min: ${filters.magnitude_min}
    magnitude_max: ${filters.magnitude_max}
    lat_min: ${filters.lat_min}
    lat_max: ${filters.lat_max}
    lon_min: ${filters.lon_min}
    lon_max: ${filters.lon_max}
    depth_min: ${filters.depth_min}
    depth_max: ${filters.depth_max}
    hypocentral_distance_min: ${filters.hypocentral_distance_min}
    hypocentral_distance_max: ${filters.hypocentral_distance_max}
    epicentral_distance_min: ${filters.epicentral_distance_min}
    epicentral_distance_max: ${filters.epicentral_distance_max}
    # Additional filters available for raw data analysis
    require_both_p_and_s: false           # true = keep only event-station pairs with both P and S arrivals
    azimuthal_gap_max: null               # degrees, null = no filter
    min_picks_per_event: null             # null = no filter
    max_picks_per_event: null             # null = no filter

  plots_to_generate:
    source_receiver_maps: true            # map view + latitude/longitude depth cross-sections
    histogram_source_receivers: false     # latitude/longitude/depth of sources and receivers
    histogram_temporal: false
    histogram_magnitude: false
    histogram_epicentral_distance: false
    histogram_hypocentral_distance: false
    histogram_picks_per_event: false
    cumulative_azimuthal_gap: false
    histogram_magnitude_picks: false

  source_receiver_maps:
    plot_picks: true                      # true = also show receivers that only have picks (orange)

  histogram_temporal:
    time_binning: "monthly"               # daily | weekly | monthly | yearly

  distance_histograms:                    # epicentral and hypocentral distance
    plot_type: "both"                     # histogram | cumulative | both
    enable_magnitude_bin: false           # true = one histogram per magnitude bin
    magnitude_bin_size: 0.2               # bins start at filters.magnitude_min (0 if null)

  histogram_magnitude_picks:
    plot_type: "both"                     # histogram | cumulative | both

  # Overrides of the global 'plots' section for this module only
  plots:
    pick_lines:
      enabled: false                      # one line per event-station pair is heavy for full catalogs

# QuakeML to HDF5 conversion. Writes the tables read by data.use_hdf5 (events, stations,
# picks, arrivals). Runs before the pipeline, so with data.use_hdf5: true the pipeline
# reads the freshly written file.
hdf5_conversion:
  enabled: false
  output_file: "${data.hdf5_file}"

  # Filters of this module only; every key defaults to the global filter of the same name
  filters:
    manual_picks_only: ${filters.manual_picks_only}
    magnitude_min: ${filters.magnitude_min}
    magnitude_max: ${filters.magnitude_max}
    lat_min: ${filters.lat_min}
    lat_max: ${filters.lat_max}
    lon_min: ${filters.lon_min}
    lon_max: ${filters.lon_max}
    depth_min: ${filters.depth_min}
    depth_max: ${filters.depth_max}
    hypocentral_distance_min: ${filters.hypocentral_distance_min}
    hypocentral_distance_max: ${filters.hypocentral_distance_max}
    epicentral_distance_min: ${filters.epicentral_distance_min}
    epicentral_distance_max: ${filters.epicentral_distance_max}

  save_all_picks: true                    # false = only picks referenced by an arrival
  single_pick_per_phase: true             # keep one P-type and one S-type pick per event-station pair
                                          # (exact P/S over Pg/Pn/...; manual over automatic)
  phase_hint_from_arrival: true           # use the arrival's phase when a pick has no phase_hint
  require_station_coordinates: true       # drop picks/arrivals of stations missing from the station list

  # Columns written per table; an empty list writes all columns
  event_fields: [event_id, catalog, origin_time, latitude, longitude, depth, magnitude,
                 magnitude_type, num_picks, num_arrivals]   # azimuthal_gap is also available
  station_fields: [station_id, latitude, longitude, depth]
  pick_fields: [pick_id, event_id, catalog, station_id, pick_time, phase_hint, evaluation_mode]
  arrival_fields: []

origin_time:
  mode: "fixed"                           # fixed | unix_epoch
  fixed_value: 0.0                        # seconds; used when mode is 'fixed'

# Spherical Earth (the spherical LATTE branch). Positions are longitude and WGS84 geodetic
# latitude (degrees) and depth below mean sea level (km); no coordinate transformation is
# applied. This block checks the coordinates of events and stations and defines the grid
# origin and spacing, inherited by initial_velocity_model.
coordinate_transform:
  enabled: true
  earth_radius_km: 6371.0                 # radius of the spherical Earth (LATTE earth_radius / 1000)
  origin_lon: -108.0                      # degrees; west edge of the grid (first longitude node)
  origin_lat: 34.5                        # degrees, geodetic; south edge of the grid (first latitude node)
  origin_depth_km: 0.0                    # km below MSL; top of the grid (first depth node)
  grid_spacing: [0.01, 0.01, 1.0]         # [dlon (deg), dlat (deg), ddepth (km)]
  output_dir: "${data.output_base_dir}/coordinate_transform"

  # Output CSV file paths (only the data that passed all filters)
  events_csv: "${coordinate_transform.output_dir}/events.csv"
  stations_csv: "${coordinate_transform.output_dir}/stations.csv"
  picks_csv: "${coordinate_transform.output_dir}/picks.csv"
  # Grid lines (nlon .. odepth, earth_radius, in metres) for the LATTE parameter file
  latte_grid_file: "${data.output_base_dir}/model/latte_grid.txt"

# Geometry and travel time file generation
geometry_traveltime:
  enabled: true

  # Input files (outputs from coordinate_transform)
  events_csv: "${coordinate_transform.events_csv}"
  stations_csv: "${coordinate_transform.stations_csv}"

  # Output directories
  geometry_dir: "${data.output_base_dir}/geometry"
  traveltime_dir: "${data.output_base_dir}/ground_truth_traveltimes"
  source_dir: "${data.output_base_dir}/model"   # slon.bin, slat.bin (deg), sdepth.bin (m), st0.bin (s)

  generate_travel_time_csv: true
  csv_output_dir: "${data.output_base_dir}/geometry_csv"
  include_magnitude_in_csv: false         # true = adds magnitude column to travel time CSV
  generate_source_binaries: true

  # apply_default_weights and apply_azimuthal_weighting are mutually exclusive
  apply_default_weights: false
  default_weight: 1.0
  # true = write 5-column geometry files (lon lat depth_m weight_p weight_s); false = 4-column (lon lat depth_m weight)
  separate_weight_p_s: false
  default_weight_p: 1.0                  # base P-wave weight; applied as-is or as a scale on azimuthal weights
  default_weight_s: 1.0                  # base S-wave weight; applied as-is or as a scale on azimuthal weights
  apply_azimuthal_weighting: false
  azimuthal_bin_size_deg: 30              # degrees; 30° creates 12 azimuthal bins
  # Weight formula: inverse_sqrt = 1/sqrt(N), inverse = 1/N
  azimuthal_weight_formula: "inverse_sqrt"
  # Azimuthal weighting uses global scale (pick counts per station-bin across ALL events)
  # When separate_weight_p_s is true, azimuthal weights are scaled by default_weight_p / default_weight_s
  phase_type: "both"                      # both | p | s
  # Apparent velocity = straight-line event-station distance (as LATTE offsets) / travel time
  p_velocity_range_m_s: [500, 10000]      # m/s; picks outside this range are discarded
  s_velocity_range_m_s: [500, 6000]       # m/s; picks outside this range are discarded

# Initial 3D velocity model created by extruding a 1D depth profile
initial_velocity_model:
  enabled: true
  initial_model_file: "/path/to/initial_model.csv"
  # km; model entries below this depth are ignored; deepest grid node with use_auto_bounds
  max_depth_km: 100.0

  # Origin and grid spacing inherited from coordinate_transform
  origin_lon: "${coordinate_transform.origin_lon}"
  origin_lat: "${coordinate_transform.origin_lat}"
  origin_depth_km: "${coordinate_transform.origin_depth_km}"
  grid_spacing: "${coordinate_transform.grid_spacing}"

  # true = the grid starts at the origin and extends east, north and down to cover all events
  # and stations (and to max_depth_km); it extends beyond the origin, with a warning, only if
  # data lie west, south or above it. false = manual bounds below.
  use_auto_bounds: true
  # Manual bounds: first and last grid nodes; used only when use_auto_bounds is false
  lon_min: null                           # degrees
  lon_max: null
  lat_min: null                           # degrees, geodetic
  lat_max: null
  depth_min: null                         # km below MSL
  depth_max: null

  output_format: "csv"                    # csv | hdf5 | both
  output_csv: "${data.output_base_dir}/velocity_model_init.csv"
  output_hdf5: "${data.output_base_dir}/velocity_model_init.h5"
  vp_binary: "${data.output_base_dir}/model/vp_init.bin"
  vs_binary: "${data.output_base_dir}/model/vs_init.bin"

  # HDF5 output options; used when output_format is 'hdf5' or 'both'
  hdf5_options:
    compression: "gzip"                   # gzip | lzf | null
    compression_level: 4                  # 0–9 for gzip; 4 is balanced
    parallel_processing: true
    n_jobs: -1                            # -1 = all cores, 1 = serial, N = N cores
    show_progress: true
    create_coarse_dataset: false          # true = write coarse dataset inside the HDF5 file
    write_coarse_csv: false               # true = write a separate coarse CSV file
    output_coarse_csv: "${data.output_base_dir}/velocity_model_init_coarse.csv"
    coarse_grid:
      dlon: 0.02                          # degrees; must be an integer multiple of fine dlon
      dlat: 0.02                          # degrees; must be an integer multiple of fine dlat
      ddepth: 2.0                         # km; must be an integer multiple of fine ddepth

  interpolate: true
  neighbor_threshold: 5
  phase_type: "both"                      # both | p | s

# Final data visualization: station/event plots of the data written by the pipeline and
# velocity model plots. Styling comes from 'plots'; add a 'plots' node here to override.
final_data_visualization:
  enabled: true

  # Station and event map view and cross-section plots
  station_event_vis:
    enabled: true
    output_dir: "${data.output_base_dir}/visualizations"

  # Velocity model depth slice and 1D profile plots
  velocity_model_vis:
    enabled: false
    output_dir: "${data.output_base_dir}/visualizations"
    plot_depth_slices: true
    # km below MSL; one longitude-latitude contourf plot (Vp + Vs) is produced per depth
    depth_slices: [5, 10, 20, 30, 40, 50]
    plot_profiles: true
    profile_type: "both"                  # lat | lon | both

  plots: {}

# Unified plotting controls, inherited by raw_data_visualization and final_data_visualization.
# Each of them may override any key through its own 'plots' node.
plots:
  figure:
    dpi: 300
    format: "png"                         # png | pdf | svg
    size: [12, 10]                        # maps and cross-sections [width, height] in inches
    histogram_size: [12, 7]               # histograms; two-panel plots are 1.5x wider
  fontsize:
    title: 16
    axis_label: 16
    axis_ticks: 14
    legend: 12
    colorbar_label: 14
    colorbar_ticks: 14
    statistics: 12                        # statistics text boxes
  fontweight:
    title: "bold"                         # normal | bold
    axis_label: "normal"

  # Sources (events): sized by magnitude, coloured by depth (map) or magnitude (cross-sections)
  events:
    marker: "*"
    size: 100
    color: "red"                          # used when show_colorbar is false
    alpha: 0.7
    show_colorbar: true                   # false = single colour, no colorbar
  receivers:
    marker: "^"
    size: 30
    color: "blue"
    picks_only_color: "orange"            # receivers with picks but no arrivals (raw data plots)
  # One line per event-station pair with a pick
  pick_lines:
    enabled: true
    color: "gray"
    alpha: 0.3                            # 0 = transparent, 1 = opaque
    linewidth: 0.5

  equal_aspect: false                     # true = equal physical scale in km on both axes (at the mean latitude)
  max_depth: null                         # km, deepest depth shown in cross-sections; null = auto

  # Basin boundary overlays, shown on map views only
  basin_boundaries:
    enabled: false
    show_labels: true                     # false = boundary lines only
    data_dir: "/path/to/basin_boundaries"
    # Each basin may override any style key below (e.g. line_color); label: null hides its label
    basins:
      - file: "CentralBasin_Verticies_WGS84.csv"
        label: "Central Basin"
      - file: "DelawareBasin_Verticies_WGS84.csv"
        label: "Delaware Basin"
      - file: "MidlandBasin_Verticies_WGS84.csv"
        label: "Midland Basin"
    line_color: "darkgreen"
    line_width: 2
    line_style: "-"                       # - | -- | : | -.
    line_alpha: 0.8
    label_color: null                     # null = line_color
    label_fontsize: 12
    label_fontweight: "bold"              # normal | bold
    label_offset_x: 0.0                   # degrees offset from basin centroid
    label_offset_y: 0.0

  # Raw data analysis plots (histograms, cumulative distributions)
  histograms:
    bins: 50
    alpha: 0.7
    show_statistics: true
    rotate_time_labels: 45                # degrees, temporal histogram
    colors:
      sources: "red"
      receivers: "blue"
      temporal: "steelblue"
      magnitude: "green"
      picks_per_event: "blue"
      epicentral_distance: {histogram: "darkgreen", cumulative: "crimson"}
      hypocentral_distance: {histogram: "darkblue", cumulative: "red"}
      magnitude_picks: {histogram: "purple", cumulative: "darkorange"}
    azimuthal_gap:
      line_width: 2.5
      line_color: "darkred"
      line_style: "-"
      show_percentiles: true
