# configs/preprocess/example.yaml
# Minimal example configuration for preprocessing QuakeML seismic data

defaults:
  - default
  - _self_

preprocessing:
  output_dir: "/path/to/output"
  run_pipeline: true                      # false = only raw visualization / HDF5 conversion

data:
  use_hdf5: true
  hdf5_file: "/path/to/seismic_data.h5"
  quakeml_dir: "/path/to/quakeml"        # parsed once for raw visualization / HDF5 conversion / pipeline (use_hdf5: false)
  station_file: "/path/to/station_list.txt"
  output_base_dir: "/path/to/output"

# Filters of the preprocessing pipeline; raw_data_visualization.filters and
# hdf5_conversion.filters default to these values
filters:
  magnitude_min: 2.0

# Plot the raw QuakeML catalog (own filters; here magnitude_min is overridden)
raw_data_visualization:
  enabled: false

# Convert QuakeML to the HDF5 file read when data.use_hdf5 is true
hdf5_conversion:
  enabled: false

# Grid origin (west edge, south edge, top) and spacing [dlon deg, dlat deg, ddepth km]
coordinate_transform:
  origin_lon: 0.0
  origin_lat: 0.0
  origin_depth_km: 0.0
  grid_spacing: [0.01, 0.01, 1.0]

initial_velocity_model:
  initial_model_file: "/path/to/initial_model.csv"
