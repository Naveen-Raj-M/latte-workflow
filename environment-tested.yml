# Exact versions of the direct dependencies the workflow was last tested with
# (Linux x86_64, conda-forge). Use it to reproduce a known-good environment:
#   conda env create -f environment-tested.yml
name: latte-workflow
channels:
  - conda-forge
dependencies:
  - python=3.13.18
  - numpy=2.5.4
  - pandas=2.3.3
  - scipy=1.18.1
  - matplotlib-base=3.11.2
  - h5py=3.16.0
  - pytables=3.11.1
  - hydra-core=1.3.7
  - obspy=1.5.1
  - joblib=1.6.0
  - tqdm=4.70.1
  - numba=0.68.1
