# Example Configuration for LATTE Checkerboard Test
# Copy this file to config.yaml and update paths for your project

general:
  # Output directory - all results will be saved here
  output_dir: "/home/rajmanoharann/latte_traveltime/checkerboard_test_output"

  log_level: "INFO"
  random_seed: 42

input:
  # Input velocity model CSV from preprocess module
  velocity_model_csv: "/home/rajmanoharann/latte_traveltime/preprocess_output/velocity_model_cartesian.csv"

  # Original geometry directory (will be reused, not modified)
  geometry_dir: "/home/rajmanoharann/latte_traveltime/preprocess_output/geometry"

  # Synthetic traveltime directory from LATTE forward modeling
  # Update this path after running LATTE with checkerboard model
  synthetic_traveltime_dir: "/home/rajmanoharann/latte_traveltime/synthetic_traveltimes"

  # Ground truth traveltime CSV for metadata
  ground_truth_csv: "/home/rajmanoharann/latte_traveltime/preprocess_output/geometry_csv/ground_truth_traveltimes.csv"

  # Inverted model directory from LATTE inversion
  # Update this path after running LATTE inversion
  inverted_model_dir: "/home/rajmanoharann/latte_traveltime/inverted_model"

checkerboard:
  enabled: true
  pattern_type: "sinusoidal"  # "sinusoidal" or "block"

  # ±5% velocity perturbation
  amplitude: 0.05

  # Wavelengths - adjust based on your domain size and expected resolution
  # For a ~200 km × 180 km × 20 km domain, these are reasonable starting values
  wavelength_x_km: 20.0   # E-W wavelength
  wavelength_y_km: 20.0   # N-S wavelength
  wavelength_z_km: 5.0    # Vertical wavelength

  # Phase shifts (radians) - use 0.0 for standard checkerboard
  phase_shift_x: 0.0
  phase_shift_y: 0.0
  phase_shift_z: 0.0

  # Apply to both P and S velocities
  apply_to_vp: true
  apply_to_vs: true

  # Velocity bounds (m/s) - clip perturbed values to realistic ranges
  vp_min: 1000.0
  vp_max: 9000.0
  vs_min: 500.0
  vs_max: 5500.0

traveltime_noise:
  enabled: true
  noise_type: "gaussian"

  # Default noise parameters (can be overridden per phase)
  gaussian:
    mean: 0.0
    std: 0.02  # 20 ms standard deviation

  uniform:
    low: -0.03
    high: 0.03

  # Phase-specific noise (optional)
  p_wave:
    mean: 0.0
    std: 0.015  # 15 ms for P-waves

  s_wave:
    mean: 0.0
    std: 0.025  # 25 ms for S-waves (typically larger uncertainty)

  output_precision: "single"

model_conversion:
  enabled: true

  # Grid dimensions - MUST match your LATTE configuration exactly
  # Check your LATTE input file for these values
  grid:
    nx: 401
    ny: 361
    nz: 43
    dx: 0.5
    dy: 0.5
    dz: 0.5
    origin_x: 0.0
    origin_y: 0.0
    origin_z: 0.0

  binary_precision: "single"
  convert_to_kms: true

  # Chapman transform (only if using spherical coordinates in LATTE)
  apply_chapman_inverse: false
  earth_radius_km: 6371.0

  # "sample" = sample at coarse grid points (recommended)
  # "expand" = create full fine grid CSV
  processing_mode: "sample"

  # Optional: process gradient fields if available
  additional_fields: []
    # - "grad_vp"
    # - "grad_vs"

visualization:
  enabled: true

  # Which models to visualize
  visualize_input: true
  visualize_checkerboard: true
  visualize_inverted: true
  visualize_difference: true  # Shows (inverted - checkerboard)

  # Which planes to plot
  planes:
    - "xy"  # Depth slices
    - "xz"  # North-South vertical slices
    - "yz"  # East-West vertical slices

  # Velocity field to visualize
  velocity_field: "vp"  # "vp" or "vs"

  # Slice selection
  # null = plot all with spacing, or specify list of indices
  xy_slices: null  # e.g., [0, 10, 20, 30, 40] for specific depths
  xz_slices: null  # e.g., [180] for middle slice
  yz_slices: null  # e.g., [200] for middle slice

  # Spacing (plot every Nth slice if plotting all)
  slice_spacing:
    xy: 5   # Every 5th depth slice
    xz: 20  # Every 20th Y slice
    yz: 20  # Every 20th X slice

  # Color settings
  colormap: "seismic"  # Try: "seismic", "RdBu_r", "viridis", "jet"

  # For velocity plots (null = auto-scale)
  vmin: null  # e.g., 3.0 for 3 km/s
  vmax: null  # e.g., 7.0 for 7 km/s

  # For difference plots
  diff_vmin: -0.5  # km/s
  diff_vmax: 0.5   # km/s
  symmetric_colorbar: true

  # Figure settings
  figure:
    dpi: 150
    figsize: [10, 8]
    format: "png"  # "png", "pdf", or "svg"

  # Appearance
  show_colorbar: true
  show_grid: true
  show_title: true
  font_size:
    title: 14
    labels: 12
    colorbar: 10

workflow:
  # Control which steps to execute
  step1_create_checkerboard: true
  step2_add_noise: true
  step3_convert_inverted: true
  step4_visualize: true
